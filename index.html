<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10282F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CardioControl Mante">
<title>CardioControl Mante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F7F7; --card:#FFFFFF; --ink:#10282F; --muted:#587076; --line:#D3DEDF;
  --brand:#0E6E6E; --on-brand:#FFFFFF; --alert:#B4380F; --alert-bg:#FCE9E1; --ok:#2F6B3A;
  --z-baja:#2F6FB3; --z-normal:#2E8B4E; --z-elev:#B88A00; --z-e1:#D9731A; --z-e2:#C62828; --z-grave:#7A0F0F; --warn:#8A5200; --warn-bg:#FFF3DC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1A1E; --card:#14262B; --ink:#E8F1F2; --muted:#93AAB0; --line:#27414A;
    --brand:#3FB5B0; --on-brand:#06201F; --alert:#FF9A73; --alert-bg:#3A2018; --ok:#7BC58A;
    --z-baja:#7FB2EE; --z-normal:#6FCF8E; --z-elev:#F2D04B; --z-e1:#FFA94D; --z-e2:#FF6B6B; --z-grave:#FFA3A3; --warn:#FFC266; --warn-bg:#3A2A12;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.6rem;line-height:1.2;margin:0}
h2{font-size:1.25rem;margin:28px 0 12px}
p{margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.top .quien{color:var(--muted);font-size:.95rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 16px;min-height:48px}
button.primario{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:700;width:100%}
button.enlace{border:0;background:none;color:var(--brand);padding:8px;min-height:44px;text-decoration:underline}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
textarea{min-height:80px}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tipos button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:700}
.tipos button:last-child:nth-child(odd){grid-column:1/-1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px 18px;margin-top:12px}
.msg{min-height:1.5em;margin-top:12px;font-weight:700}
.msg.error{color:var(--alert)} .msg.ok{color:var(--ok)}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:10px 14px}
.item.alerta{border-left-color:var(--alert);background:var(--alert-bg)}
.item .cuando{color:var(--muted);font-size:.9rem}
.item .que{font-weight:700}
.item .aviso{color:var(--alert);font-weight:700;font-size:.95rem}
.pac{width:100%;text-align:left;display:block}
.pac .n{font-weight:700}
.pac .d{color:var(--muted);font-size:.9rem}
.pac.alerta{border-left:6px solid var(--alert)}
.vacio{color:var(--muted)}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font-size:10px}
.leyenda{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-size:.9rem;color:var(--muted);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.chip i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.badge{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.85rem;font-weight:700;border:1.5px solid currentColor;line-height:1.5}
.ref-nota{color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:6px 10px;font-size:.95rem;margin-top:6px;font-weight:700}
.fila-btn{display:flex;gap:8px;align-items:center;justify-content:space-between}
#mapa{height:380px;border-radius:12px;border:1px solid var(--line);margin-top:12px;background:var(--card);overflow:hidden}
.escala{flex:1;height:10px;border-radius:5px;background:linear-gradient(90deg,rgb(245,197,66),rgb(240,140,46),rgb(198,40,40));max-width:200px}
table.tabla{width:100%;border-collapse:collapse;font-size:.95rem}
table.tabla th,table.tabla td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.tabla .num{text-align:right}
.leaflet-container{font:inherit}
.consultorio{color:var(--muted);font-size:.95rem;margin:0 0 4px}
.consultorio strong{color:var(--ink)}
.consultorio a{color:var(--brand);font-weight:700}
.urgencia{border:1px solid var(--alert);border-left:6px solid var(--alert);background:var(--alert-bg);border-radius:12px;padding:12px 16px;margin:12px 0}
.urgencia p{margin:0 0 10px}
a.btn-911{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:10px;background:var(--alert);color:var(--paper);font-weight:700;text-decoration:none}
.check{display:flex;align-items:center;gap:10px;font-weight:400;margin:10px 0 0;min-height:44px}
.check input{width:24px;height:24px;min-height:0;flex:none}
button.secundario{width:100%;border:2px solid var(--brand);color:var(--brand);background:none;font-weight:700}
.msg button{display:inline-block;margin-top:6px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin-top:12px}
details.urgente{border-left:6px solid var(--alert)}
summary{font-weight:700;min-height:48px;display:flex;align-items:center;cursor:pointer}
details ul{padding-left:20px;margin:0 0 12px}
details li{margin-bottom:8px}
details h3{font-size:1rem;margin:12px 0 6px}
.nota{color:var(--muted);font-size:.9rem}
.marca{display:flex;align-items:center;gap:12px;min-width:0}
img.logo{width:56px;height:56px;border-radius:14px;flex:none}
.instalar{max-width:640px;margin:0 auto;padding:16px 16px 0}
.instalar .panel{margin-top:0;padding-top:16px}
.instalar p{margin:6px 0 12px}
.invitar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:16px}
a.btn-wa{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border-radius:10px;background:var(--brand);color:var(--on-brand);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div id="instalar" class="instalar" hidden></div>
<div id="app"><p class="vacio">Cargando…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
/* ================== CONFIGURACIÓN ================== */
const SUPABASE_URL = 'https://weifxnszhirnmsxsfago.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Zb-xmUeyX1BB6aVBxCAT2w_5-5xMyJO';

/* Datos del médico y del consultorio que ven los pacientes. Cámbialos aquí si quieres. */
const MEDICO = { nombre: 'Dr. Rodolfo Ramírez Campillo', especialidad: 'Cardiología', consultorio: 'Consultorio Cardiología Mante', telefono: '831 241 7049', nota: 'Previa cita', facebook: 'https://www.facebook.com/share/1Em4gNfdyU/' };

/* Número de emergencias y detector sencillo de síntomas de alarma en las notas del paciente. */
const URGENCIAS = { numero: '911' };
const sinAcentos = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const SINTOMAS_RE = /(dolor|duele|duelen|molestia|presion|opresion)[^.]{0,25}pecho|dolor toracico|opresion|falta(n)? (el |de )?aire|ahogo|no puedo respirar|dificultad para respirar|desmay|sincope|perdi el conocimiento|perdida de (la )?conciencia|marea|mareo|palpitacion|taquicardia|sudor frio|confus|desorient|sangrad|sangre|hemorrag/i;

/* Umbrales de alerta para el panel del administrador.
   Ajústalos a tu criterio clínico: [mínimo, máximo]. */
const LIM = {
  sistolica: [90, 180],
  diastolica: [50, 110],
  pulso: [45, 120],
  glucosa: [70, 250],
  inr: [1.5, 4.0],
  palpitacionesMin: 30   // minutos de duración que se marcan como alerta
};

/* ================== UTILIDADES ================== */
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ahoraLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const fecha = iso => new Date(iso).toLocaleString('es', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
const state = { user:null, perfil:null, tipo:'presion', pestana:'registrar', modoRegistro:false, pacientes:[], regs:[], sel:null, canal:null, dx:[], sectores:[], vistaAdmin:'lista', filtroMapa:'', msgDx:'' };

const TIPOS = {
  presion: { t:'Presión y pulso', campos:[
    ['sistolica','Sistólica (mmHg)','number'],['diastolica','Diastólica (mmHg)','number'],['pulso','Pulso (latidos por minuto)','number'] ] },
  peso: { t:'Peso y talla', campos:[
    ['peso_kg','Peso (kg)','number','0.1'],['talla_cm','Talla (cm)','number','0.1'] ] },
  palpitaciones: { t:'Palpitaciones', campos:[
    ['palp_duracion_min','Duración (minutos)','number'],['palp_episodios','Episodios en el día','number'],['pulso','Pulso durante el episodio (lpm)','number'] ] },
  glucosa: { t:'Glucosa', campos:[
    ['glucosa_mgdl','Glucosa (mg/dL)','number'],
    ['glucosa_momento','¿Cuándo la midió?','select',[['ayuno','En ayunas'],['antes_comida','Antes de comer'],['despues_comida','Después de comer'],['otro','Otro momento']]] ] },
  laboratorio: { t:'Laboratorio e INR', campos:[
    ['inr','INR (control anticoagulante)','number','0.1'],
    ['lab_nombre','Estudio de laboratorio','select',[['Creatinina sérica','Creatinina sérica'],['NT-proBNP','NT-proBNP'],['HbA1c','HbA1c'],['Glucosa (laboratorio)','Glucosa (laboratorio)'],['Colesterol total','Colesterol total'],['Triglicéridos','Triglicéridos'],['HDL','HDL'],['LDL','LDL'],['Otro','Otro (escribir el nombre)']]],
    ['lab_otro','Nombre del estudio (solo si eligió Otro)','text'],
    ['lab_valor','Resultado','number','any'],['lab_unidad','Unidad','text'] ] }
};

function resumen(r, tallaRef) {
  switch (r.tipo) {
    case 'presion': return `${r.sistolica ?? '—'}/${r.diastolica ?? '—'} mmHg, pulso ${r.pulso ?? '—'}`;
    case 'peso': {
      const v = r.peso_kg != null ? imc(r.peso_kg, r.talla_cm != null ? r.talla_cm : tallaRef) : null;
      return [r.peso_kg != null ? r.peso_kg + ' kg' : null, r.talla_cm != null ? r.talla_cm + ' cm' : null, v != null ? 'IMC ' + v.toFixed(1) : null].filter(Boolean).join(', ');
    }
    case 'palpitaciones': return `Palpitaciones: ${r.palp_duracion_min ?? '—'} min, ${r.palp_episodios ?? '—'} episodio(s)` + (r.pulso != null ? `, pulso ${r.pulso}` : '');
    case 'glucosa': return `Glucosa ${r.glucosa_mgdl} mg/dL (${({ayuno:'en ayunas',antes_comida:'antes de comer',despues_comida:'después de comer',otro:'otro momento'})[r.glucosa_momento] || '—'})`;
    case 'laboratorio': return [r.inr != null ? 'INR ' + r.inr : null, r.lab_nombre ? `${r.lab_nombre} ${r.lab_valor ?? ''} ${r.lab_unidad ?? ''}`.trim() : null].filter(Boolean).join(', ');
  }
  return '';
}

function alertas(r, p) {
  const a = [];
  const fuera = (v, [lo, hi], n) => { if (v != null && (v < lo || v > hi)) a.push(`${n} ${v}`); };
  fuera(r.sistolica, LIM.sistolica, 'Sistólica');
  fuera(r.diastolica, LIM.diastolica, 'Diastólica');
  fuera(r.pulso, LIM.pulso, 'Pulso');
  fuera(r.glucosa_mgdl, LIM.glucosa, 'Glucosa');
  if (r.inr != null) {
    if (p && p.inr_min != null && p.inr_max != null) fuera(r.inr, [Number(p.inr_min), Number(p.inr_max)], 'INR');
    else if (!(p && p.indicacion)) fuera(r.inr, LIM.inr, 'INR');
  }
  if (r.palp_duracion_min != null && r.palp_duracion_min >= LIM.palpitacionesMin) a.push(`Palpitaciones de ${r.palp_duracion_min} min`);
  if (r.notas && SINTOMAS_RE.test(sinAcentos(r.notas))) a.push('Notas con posible síntoma de alarma');
  if (r.tipo === 'laboratorio' && r.lab_nombre === 'LDL' && r.lab_valor != null && p && LDL_META[p.riesgo_cv] != null && Number(r.lab_valor) >= LDL_META[p.riesgo_cv]) {
    a.push(`LDL ${r.lab_valor} (meta menor de ${LDL_META[p.riesgo_cv]})`);
  }
  return a;
}

const consultorioHTML = () => `<div class="consultorio">
  <strong>${esc(MEDICO.nombre)}</strong>, ${esc(MEDICO.especialidad)}<br>
  ${esc(MEDICO.consultorio)}<br>
  Tel. <a href="tel:${MEDICO.telefono.replace(/\D/g, '')}">${esc(MEDICO.telefono)}</a>, ${esc(MEDICO.nota.toLowerCase())}<br>
  <a href="${MEDICO.facebook}" target="_blank" rel="noopener">Nuestro Facebook</a>
</div>`;

const urgenciaHTML = () => `<div class="urgencia" role="note">
  <p><strong>¿Es una urgencia?</strong> Dolor de pecho, falta de aire, desmayo o alteración de la conciencia, palpitaciones intensas o malestar general importante: no espere respuesta por aquí. Llame al ${URGENCIAS.numero} o acuda a urgencias.</p>
  <a class="btn-911" href="tel:${URGENCIAS.numero}">Llamar al ${URGENCIAS.numero}</a>
  <p class="nota" style="margin:10px 0 0">Esta aplicación no se revisa en tiempo real.</p>
</div>`;

function itemHTML(r, p, verAlertas, tallaRef, esPaciente) {
  const al = verAlertas ? alertas(r, p) : [];
  const fr = fueraDeReferencia(r, p, tallaRef);
  const cat = r.tipo === 'presion' ? categoriaPA(r.sistolica, r.diastolica) : null;
  return `<li class="item${al.length ? ' alerta' : ''}">
    <div class="cuando">${esc(fecha(r.medido_en))}</div>
    <div class="que">${esc(resumen(r, tallaRef))}</div>
    ${cat ? `<div style="margin-top:4px"><span class="badge" style="color:${CAT_PA[cat].c}">${CAT_PA[cat].t}</span></div>` : ''}
    ${r.notas ? `<div>${esc(r.notas)}</div>` : ''}
    ${fr.length ? `<div class="ref-nota">${esPaciente ? NOTA_REF : 'Fuera de referencia: ' + esc(fr.join(', '))}</div>` : ''}
    ${esPaciente && cat === 'grave' ? GRAVE_HTML : ''}
    ${al.length ? `<div class="aviso">Alerta: ${esc(al.join(', '))}</div>` : ''}
  </li>`;
}

/* ================== META DE INR, RIESGO Y LABORATORIO ================== */
/* INR: ACC/AHA 2020 (valvulopatías), ESC/EACTS 2021 y guías de FA. El médico decide la meta de cada paciente. */
const PRESETS = [
  { id: '', t: 'Sin definir' },
  { id: 'ninguno', t: 'No toma anticoagulante' },
  { id: 'doac', t: 'Anticoagulante directo (inhibidor del factor Xa o dabigatrán): sin INR', alias: 'Anticoagulante directo (sin control de INR)' },
  { id: 'fa_vka', t: 'Fibrilación auricular con warfarina', min: 2.0, max: 3.0 },
  { id: 'em_fa', t: 'Estenosis mitral reumática moderada o grave con FA', min: 2.0, max: 3.0 },
  { id: 'mec_ao', t: 'Prótesis mecánica aórtica, sin factores de riesgo', min: 2.0, max: 3.0 },
  { id: 'mec_ao_fr', t: 'Prótesis mecánica aórtica, con factores de riesgo', min: 2.5, max: 3.5 },
  { id: 'mec_mi', t: 'Prótesis mecánica mitral o tricuspídea', min: 2.5, max: 3.5 },
  { id: 'bio', t: 'Bioprótesis quirúrgica (primeros 3 a 6 meses)', min: 2.0, max: 3.0 },
  { id: 'onx', t: 'Prótesis aórtica On-X (después de 3 meses)', min: 1.5, max: 2.0 },
  { id: 'otro', t: 'Personalizado' }
];

/* Estudios de laboratorio con gráfica. Unidades en mg/dL salvo indicación. */
const LABS = [
  { n: 'Creatinina sérica', u: 'mg/dL' },
  { n: 'NT-proBNP', u: 'pg/mL' },
  { n: 'HbA1c', u: '%' },
  { n: 'Glucosa (laboratorio)', u: 'mg/dL' },
  { n: 'Colesterol total', u: 'mg/dL' },
  { n: 'Triglicéridos', u: 'mg/dL' },
  { n: 'HDL', u: 'mg/dL' },
  { n: 'LDL', u: 'mg/dL' }
];

/* Riesgo cardiovascular y meta de LDL (ESC/EAS 2019), en mg/dL: se alerta si el LDL es igual o mayor. */
const RIESGOS = ['Bajo', 'Moderado', 'Alto', 'Muy alto'];
const LDL_META = { 'Bajo': 116, 'Moderado': 100, 'Alto': 70, 'Muy alto': 55 };

const tieneMeta = p => p && p.inr_min != null && p.inr_max != null;
const rangoTexto = p => Number(p.inr_min).toFixed(1) + ' a ' + Number(p.inr_max).toFixed(1);
const fmt = v => String(Math.round(v * 100) / 100);
const fechaCorta = iso => new Date(iso).toLocaleDateString('es', { day: 'numeric', month: 'short', year: '2-digit' });

/* Índice de masa corporal (kg/m²). Devuelve null si los datos no son plausibles. */
function imc(peso, tallaCm) {
  const kg = Number(peso), cm = Number(tallaCm);
  if (!(kg >= 20 && kg <= 400 && cm >= 100 && cm <= 230)) return null;
  const m = cm / 100;
  return kg / (m * m);
}
function categoriaIMC(v) {
  if (v < 18.5) return 'Bajo peso';
  if (v < 25) return 'Peso normal';
  if (v < 30) return 'Sobrepeso';
  if (v < 35) return 'Obesidad grado I';
  if (v < 40) return 'Obesidad grado II';
  return 'Obesidad grado III';
}
/* Talla más reciente registrada (la lista viene ordenada de la más nueva a la más antigua). */
function ultimaTalla(regs) {
  const r = (regs || []).find(x => x.talla_cm != null);
  return r ? Number(r.talla_cm) : null;
}
/* Serie de IMC en el tiempo: usa la talla del propio registro o la última talla conocida hasta ese momento. */
function puntosIMC(regs) {
  const orden = (regs || []).filter(r => r.tipo === 'peso').slice().sort((a, b) => new Date(a.medido_en) - new Date(b.medido_en));
  let talla = null;
  const pts = [];
  for (const r of orden) {
    if (r.talla_cm != null) talla = Number(r.talla_cm);
    const v = r.peso_kg != null ? imc(r.peso_kg, talla) : null;
    if (v != null) pts.push({ t: r.medido_en, v });
  }
  return pts.slice(-30);
}

function grupoAnticoag(p) {
  p = p || {};
  if (tieneMeta(p)) return 'vka';
  const x = p.indicacion ? PRESETS.find(z => z.id && (z.t === p.indicacion || z.alias === p.indicacion)) : null;
  if (x && x.id === 'doac') return 'doac';
  if (x && x.id === 'ninguno') return 'ninguno';
  return 'sin';
}

function camposActivos() {
  return TIPOS[state.tipo].campos.filter(c => !(c[0] === 'inr' && !tieneMeta(state.perfil)));
}

function metaTextoAdmin(p) {
  if (tieneMeta(p)) return 'Meta de INR ' + rangoTexto(p);
  if (p.indicacion) return esc(p.indicacion);
  return 'Anticoagulación sin definir';
}

function metaPacienteHTML(p) {
  return tieneMeta(p) ? `<p style="margin:16px 0 0">Su meta de INR, indicada por su médico: <strong>${rangoTexto(p)}</strong></p>` : '';
}

/* ---------- Administrador: anticoagulación ---------- */
function anticoagulacionHTML(p) {
  const sel = (p.indicacion ? PRESETS.find(x => x.id && (x.t === p.indicacion || x.alias === p.indicacion)) : null) || (p.indicacion ? PRESETS.find(x => x.id === 'otro') : PRESETS[0]);
  return `<h2>Anticoagulación</h2>
  <div class="panel" style="padding-top:12px">
    <label for="indic">Indicación</label>
    <select id="indic">${PRESETS.map(x => `<option value="${x.id}"${x === sel ? ' selected' : ''}>${esc(x.t)}</option>`).join('')}</select>
    <label for="imin">INR mínimo</label>
    <input id="imin" type="number" inputmode="decimal" step="0.1" value="${p.inr_min ?? ''}">
    <label for="imax">INR máximo</label>

    <div class="msg" id="msg-inr" role="status"></div>
    <button class="primario" id="guardar-inr">Guardar</button>
  </div>`;
}

function enlazarAnticoagulacion(p) {
  const selI = document.getElementById('indic');
  const iMin = document.getElementById('imin');
  const iMax = document.getElementById('imax');
  const msg = document.getElementById('msg-inr');
  const sinINR = () => ['', 'ninguno', 'doac'].includes(selI.value);
  const ajustar = () => { iMin.disabled = iMax.disabled = sinINR(); };
  selI.onchange = () => {
    const x = PRESETS.find(z => z.id === selI.value);
    if (x && x.min != null) { iMin.value = x.min.toFixed(1); iMax.value = x.max.toFixed(1); }
    if (sinINR()) { iMin.value = ''; iMax.value = ''; }
    ajustar();
  };
  ajustar();
  document.getElementById('guardar-inr').onclick = async () => {
    const x = PRESETS.find(z => z.id === selI.value);
    let min = null, max = null;
    if (!sinINR()) {
      min = parseFloat(iMin.value); max = parseFloat(iMax.value);
      if (!(min >= 1 && max <= 5 && min < max)) { msg.className = 'msg error'; msg.textContent = 'Escribe un rango válido, por ejemplo 2.0 a 3.0.'; return; }
    }
    const indicacion = x && x.id ? x.t : null;
    const { error } = await db.from('profiles').update({ inr_min: min, inr_max: max, indicacion }).eq('id', p.id);
    if (error) { msg.className = 'msg error'; msg.textContent = 'No se pudo guardar: ' + error.message; return; }
    p.inr_min = min; p.inr_max = max; p.indicacion = indicacion;
    msg.className = 'msg ok'; msg.textContent = 'Guardado.';
  };
}

/* ================== RANGOS DE REFERENCIA ================== */
/* Adultos. Presión: AHA/ACC 2025. Pulso en reposo: AHA (60 a 100). Glucosa y HbA1c: ADA.
   Lípidos: NCEP ATP III. NT-proBNP: ESC 2021 de insuficiencia cardiaca (fuera de un cuadro agudo).
   Creatinina: rangos habituales de laboratorio. IMC: OMS. Cámbialos aquí si quieres otros. */
const CAT_PA = {
  baja:    { t: 'Baja', rango: 'menos de 90/60', c: 'var(--z-baja)' },
  normal:  { t: 'Normal', rango: 'menos de 120/80', c: 'var(--z-normal)' },
  elevada: { t: 'Elevada', rango: '120 a 129 y menos de 80', c: 'var(--z-elev)' },
  etapa1:  { t: 'Hipertensión etapa 1', rango: '130 a 139 u 80 a 89', c: 'var(--z-e1)' },
  etapa2:  { t: 'Hipertensión etapa 2', rango: '140/90 o más', c: 'var(--z-e2)' },
  grave:   { t: 'Hipertensión grave', rango: 'más de 180/120', c: 'var(--z-grave)' }
};
function categoriaPA(s, d) {
  if (s == null && d == null) return null;
  const S = s == null ? null : Number(s), D = d == null ? null : Number(d);
  if ((S != null && S > 180) || (D != null && D > 120)) return 'grave';
  if ((S != null && S >= 140) || (D != null && D >= 90)) return 'etapa2';
  if ((S != null && S >= 130) || (D != null && D >= 80)) return 'etapa1';
  if (S != null && S >= 120) return 'elevada';
  if ((S != null && S < 90) || (D != null && D < 60)) return 'baja';
  return 'normal';
}
const ZONAS_SIS = [
  { hasta: 90, c: CAT_PA.baja.c }, { desde: 90, hasta: 120, c: CAT_PA.normal.c }, { desde: 120, hasta: 130, c: CAT_PA.elevada.c },
  { desde: 130, hasta: 140, c: CAT_PA.etapa1.c }, { desde: 140, hasta: 180, c: CAT_PA.etapa2.c }, { desde: 180, c: CAT_PA.grave.c }
];
const ZONAS_DIA = [
  { hasta: 60, c: CAT_PA.baja.c }, { desde: 60, hasta: 80, c: CAT_PA.normal.c }, { desde: 80, hasta: 90, c: CAT_PA.etapa1.c },
  { desde: 90, hasta: 120, c: CAT_PA.etapa2.c }, { desde: 120, c: CAT_PA.grave.c }
];
const REF_PULSO = { min: 60, max: 100, texto: '60 a 100 latidos por minuto en reposo' };
const REF_IMC = { min: 18.5, lt: 25, texto: '18.5 a 24.9 kg/m²' };
const REF_LAB = {
  'Creatinina sérica': s => s === 'F' ? { min: 0.6, max: 1.1, texto: '0.6 a 1.1 mg/dL (mujeres)' }
    : s === 'M' ? { min: 0.7, max: 1.3, texto: '0.7 a 1.3 mg/dL (hombres)' }
    : { min: 0.6, max: 1.3, texto: '0.6 a 1.3 mg/dL (varía según sexo y laboratorio)' },
  'NT-proBNP': () => ({ lt: 125, texto: 'menos de 125 pg/mL fuera de un cuadro agudo (aumenta con la edad y con enfermedad renal)' }),
  'HbA1c': () => ({ lt: 5.7, texto: 'menos de 5.7% (5.7 a 6.4% prediabetes; 6.5% o más diabetes)' }),
  'Glucosa (laboratorio)': () => ({ min: 70, lt: 100, texto: '70 a 99 mg/dL en ayunas' }),
  'Colesterol total': () => ({ lt: 200, texto: 'menos de 200 mg/dL' }),
  'Triglicéridos': () => ({ lt: 150, texto: 'menos de 150 mg/dL' }),
  'HDL': s => s === 'F' ? { min: 50, texto: '50 mg/dL o más (mujeres)' }
    : s === 'M' ? { min: 40, texto: '40 mg/dL o más (hombres)' }
    : { min: 40, texto: '40 mg/dL o más en hombres y 50 o más en mujeres' },
  'LDL': () => ({ lt: 100, texto: 'menos de 100 mg/dL (óptimo)' })
};
const GUIAS_LAB = { 'HbA1c': [{ v: 6.5, t: 'Diabetes' }] };
const refGlucometria = mom => (mom === 'despues_comida' || mom === 'otro')
  ? { min: 70, lt: 140, texto: '70 a 139 mg/dL después de comer o en otro momento' }
  : { min: 70, lt: 100, texto: '70 a 99 mg/dL en ayunas o antes de comer' };
const refINR = p => tieneMeta(p) ? { min: Number(p.inr_min), max: Number(p.inr_max), texto: 'meta indicada por su médico, ' + rangoTexto(p) } : null;
const enRango = (v, r) => !r || ((r.min == null || v >= r.min) && (r.max == null || v <= r.max) && (r.lt == null || v < r.lt));
const NOTA_REF = 'Fuera del rango de referencia: coméntelo con su médico en su consulta.';
const GRAVE_HTML = `<div class="urgencia" role="alert" style="margin:8px 0 0"><p style="margin:0"><strong>Presión muy alta.</strong> Espere 5 minutos y vuelva a medirla. Si sigue igual de alta, comuníquese con su médico de inmediato. Si además tiene dolor de pecho o de espalda, falta de aire, debilidad, dificultad para hablar o cambios en la visión, llame al ${URGENCIAS.numero}.</p></div>`;
const FUENTES_REF = 'Rangos para adultos. Presión: AHA/ACC 2025. Pulso: AHA. Glucosa y HbA1c: ADA. Lípidos: NCEP ATP III. NT-proBNP: ESC 2021. IMC: OMS. Su médico puede indicarle metas distintas.';

/* Qué valores de un registro quedan fuera de referencia. Devuelve textos cortos. */
function fueraDeReferencia(r, p, tallaRef) {
  p = p || {};
  const f = [];
  if (r.tipo === 'presion') {
    const c = categoriaPA(r.sistolica, r.diastolica);
    if (c && c !== 'normal') f.push('Presión ' + CAT_PA[c].t.toLowerCase());
    if (r.pulso != null && !enRango(Number(r.pulso), REF_PULSO)) f.push('Pulso ' + r.pulso);
  }
  if (r.tipo === 'glucosa' && r.glucosa_mgdl != null && !enRango(Number(r.glucosa_mgdl), refGlucometria(r.glucosa_momento))) f.push('Glucosa ' + r.glucosa_mgdl);
  if (r.tipo === 'laboratorio') {
    if (r.inr != null && tieneMeta(p) && !enRango(Number(r.inr), refINR(p))) f.push('INR ' + r.inr);
    const fn = REF_LAB[r.lab_nombre];
    if (fn && r.lab_valor != null && !enRango(Number(r.lab_valor), fn(p.sexo))) f.push(r.lab_nombre + ' ' + r.lab_valor);
  }
  if (r.tipo === 'peso' && r.peso_kg != null) {
    const v = imc(r.peso_kg, r.talla_cm != null ? r.talla_cm : tallaRef);
    if (v != null && !enRango(v, REF_IMC)) f.push('IMC ' + v.toFixed(1));
  }
  return f;
}

/* ---------- Gráficas con zonas de referencia ---------- */
function svgSerie({ puntos, zonas, guias, colorDe, yMin, yMax, titulo }) {
  const W = 320, H = 150, m = 30, top = 8, bot = 18;
  const vals = puntos.map(q => q.v);
  const extra = [];
  (zonas || []).forEach(z => { if (z.desde != null) extra.push(z.desde); if (z.hasta != null) extra.push(z.hasta); });
  (guias || []).forEach(g => extra.push(g.v));
  let min, max;
  if (yMin != null && yMax != null) { min = Math.min(yMin, ...vals); max = Math.max(yMax, ...vals); }
  else {
    const base = vals.concat(extra.filter(v => Number.isFinite(v)));
    min = Math.min(...base); max = Math.max(...base);
  }
  if (max === min) { max += 1; min -= 1; }
  const pad = (max - min) * 0.08; min -= pad; max += pad;
  const n = puntos.length;
  const x = i => n === 1 ? (m + W) / 2 : m + 6 + i * (W - m - 14) / (n - 1);
  const y = v => H - bot - (v - min) * (H - bot - top) / (max - min);
  const rects = (zonas || []).map(z => {
    const a = Math.max(z.desde ?? -Infinity, min), b = Math.min(z.hasta ?? Infinity, max);
    if (!(b > a)) return '';
    return `<rect x="${m}" y="${y(b).toFixed(1)}" width="${W - m}" height="${(y(a) - y(b)).toFixed(1)}" fill="${z.c}" opacity=".18"/>`;
  }).join('');
  const marcas = [];
  (zonas || []).forEach(z => [z.desde, z.hasta].forEach(v => { if (v != null && v > min && v < max && !marcas.includes(v)) marcas.push(v); }));
  marcas.sort((a, b) => a - b);
  const visibles = marcas.filter((v, i) => i === 0 || Math.abs(y(v) - y(marcas[i - 1])) >= 9);
  const etiquetas = (visibles.length ? visibles : [min + pad, max - pad])
    .map(v => `<text x="${m - 4}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`).join('');
  const lineasGuia = (guias || []).filter(g => g.v > min && g.v < max).map(g =>
    `<line x1="${m}" x2="${W}" y1="${y(g.v).toFixed(1)}" y2="${y(g.v).toFixed(1)}" stroke="var(--ink)" stroke-dasharray="3 4" opacity=".55"/>` +
    `<text x="${W - 2}" y="${(y(g.v) - 3).toFixed(1)}" text-anchor="end">${esc(g.t)} ${fmt(g.v)}</text>`).join('');
  const linea = n > 1 ? `<polyline points="${puntos.map((q, i) => `${x(i).toFixed(1)},${y(q.v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.5" opacity=".45" stroke-linejoin="round"/>` : '';
  const circulos = puntos.map((q, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(q.v).toFixed(1)}" r="4" fill="${colorDe(q)}" stroke="var(--card)" stroke-width="1.5"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tendencia de ${esc(titulo || '')}">
    <line x1="${m}" x2="${m}" y1="${top}" y2="${H - bot}" stroke="var(--line)"/>
    ${rects}${etiquetas}${lineasGuia}${linea}${circulos}
  </svg>
  <div class="leyenda"><span>${esc(fechaCorta(puntos[0].t))}</span>${n > 1 ? `<span>${esc(fechaCorta(puntos[n - 1].t))}</span>` : ''}</div>`;
}

const COLOR_DENTRO = 'var(--z-normal)', COLOR_FUERA = 'var(--z-e1)';

function panelSerie({ titulo, unidad, puntos, ref, guias, esPaciente, metaTexto }) {
  if (!puntos.length) return '';
  const refDe = q => q.ref || ref;
  const ult = puntos[puntos.length - 1];
  const r = refDe(ult);
  const dentro = enRango(ult.v, r);
  const zonas = ref ? [{ desde: ref.min, hasta: ref.max ?? ref.lt, c: COLOR_DENTRO }] : [];
  const estado = !r ? '' : esPaciente
    ? (dentro ? '' : `<div class="ref-nota">${NOTA_REF}</div>`)
    : `<span class="badge" style="color:${dentro ? COLOR_DENTRO : COLOR_FUERA}">${dentro ? 'Dentro del rango' : 'Fuera del rango'}</span>`;
  const textoRef = ref ? ref.texto : (r ? r.texto : '');
  return `<div class="panel" style="padding-top:12px">
    <strong>${esc(titulo)}</strong>
    <div style="margin:4px 0 8px">Último: <strong>${fmt(ult.v)} ${esc(unidad)}</strong> <span class="nota">(${esc(fechaCorta(ult.t))})</span> ${esPaciente ? '' : estado}</div>
    ${esPaciente ? estado : ''}
    ${svgSerie({ puntos, zonas, guias, titulo, colorDe: q => !refDe(q) ? 'var(--brand)' : enRango(q.v, refDe(q)) ? COLOR_DENTRO : COLOR_FUERA })}
    ${textoRef ? `<p class="nota" style="margin:6px 0 0">Rango de referencia: ${esc(textoRef)}.</p>` : ''}
    ${metaTexto ? `<p class="nota" style="margin:2px 0 0">${esc(metaTexto)}</p>` : ''}
  </div>`;
}

function leyendaPA() {
  return `<div class="leyenda" style="gap:10px 14px">${['normal', 'elevada', 'etapa1', 'etapa2', 'grave', 'baja']
    .map(k => `<span class="chip"><i style="background:${CAT_PA[k].c}"></i>${CAT_PA[k].t} (${CAT_PA[k].rango})</span>`).join('')}</div>`;
}

function presionHTML(regs, esPaciente) {
  const pts = regs.filter(r => r.tipo === 'presion' && (r.sistolica != null || r.diastolica != null))
    .slice().sort((a, b) => new Date(a.medido_en) - new Date(b.medido_en)).slice(-30);
  if (!pts.length) return `<h2>Presión arterial</h2><p class="vacio">Aún no hay mediciones de presión.</p>`;
  const ult = pts[pts.length - 1];
  const cat = categoriaPA(ult.sistolica, ult.diastolica);
  const desde = Date.now() - 7 * 864e5;
  const rec = pts.filter(r => new Date(r.medido_en).getTime() >= desde && r.sistolica != null && r.diastolica != null);
  let promedio = '';
  if (rec.length >= 2) {
    const s = Math.round(rec.reduce((a, r) => a + Number(r.sistolica), 0) / rec.length);
    const d = Math.round(rec.reduce((a, r) => a + Number(r.diastolica), 0) / rec.length);
    const cp = categoriaPA(s, d);
    promedio = `<p style="margin:8px 0 0">Promedio de los últimos 7 días (${rec.length} mediciones): <strong>${s}/${d} mmHg</strong> <span class="badge" style="color:${CAT_PA[cp].c}">${CAT_PA[cp].t}</span></p>`;
  }
  const serie = (k, zonas, yMin, yMax) => {
    const p = pts.filter(r => r[k] != null).map(r => ({ t: r.medido_en, v: Number(r[k]), cat: categoriaPA(r.sistolica, r.diastolica) }));
    return p.length ? svgSerie({ puntos: p, zonas, yMin, yMax, titulo: k === 'sistolica' ? 'presión sistólica' : 'presión diastólica', colorDe: q => CAT_PA[q.cat].c }) : '';
  };
  const pulso = pts.filter(r => r.pulso != null).map(r => ({ t: r.medido_en, v: Number(r.pulso) }));
  const nota = esPaciente && cat !== 'normal' ? `<div class="ref-nota">${NOTA_REF}</div>` : '';
  return `<h2>Presión arterial</h2>
  <div class="panel" style="padding-top:12px">
    <div>Última: <strong>${ult.sistolica ?? '—'}/${ult.diastolica ?? '—'} mmHg</strong> <span class="nota">(${esc(fechaCorta(ult.medido_en))})</span></div>
    <div style="margin-top:6px"><span class="badge" style="color:${CAT_PA[cat].c}">${CAT_PA[cat].t}</span></div>
    ${nota}${esPaciente && cat === 'grave' ? GRAVE_HTML : ''}
    ${promedio}
    <h3 style="font-size:1rem;margin:16px 0 4px">Sistólica (mmHg)</h3>
    ${serie('sistolica', ZONAS_SIS, 80, 150)}
    <h3 style="font-size:1rem;margin:16px 0 4px">Diastólica (mmHg)</h3>
    ${serie('diastolica', ZONAS_DIA, 50, 100)}
    ${leyendaPA()}
    <p class="nota" style="margin:8px 0 0">Clasificación AHA/ACC 2025. Cuando las dos cifras caen en categorías distintas, cuenta la más alta. El diagnóstico se hace con el promedio de 2 o más mediciones en 2 o más ocasiones.</p>
  </div>
  ${panelSerie({ titulo: 'Pulso en reposo', unidad: 'lpm', puntos: pulso, ref: REF_PULSO, esPaciente })}`;
}

function laboratoriosHTML(regs, p, esPaciente) {
  p = p || {};
  const bloques = [];
  if (tieneMeta(p)) {
    bloques.push(panelSerie({ titulo: 'INR', unidad: '', puntos: puntosDe(regs, r => r.inr != null, r => r.inr), ref: refINR(p), esPaciente }));
  }
  for (const l of LABS) {
    const meta = !esPaciente && l.n === 'LDL' && LDL_META[p.riesgo_cv] != null ? LDL_META[p.riesgo_cv] : null;
    const guias = (GUIAS_LAB[l.n] || []).concat(meta != null ? [{ v: meta, t: 'Meta' }] : []);
    bloques.push(panelSerie({
      titulo: l.n, unidad: l.u, esPaciente, guias,
      puntos: puntosDe(regs, r => r.tipo === 'laboratorio' && r.lab_nombre === l.n, r => r.lab_valor),
      ref: REF_LAB[l.n](p.sexo),
      metaTexto: meta != null ? `Meta según riesgo ${p.riesgo_cv.toLowerCase()} (ESC/EAS 2019): menos de ${meta} mg/dL.` : ''
    }));
  }
  bloques.push(panelSerie({ titulo: 'Peso', unidad: 'kg', esPaciente, puntos: puntosDe(regs, r => r.tipo === 'peso' && r.peso_kg != null, r => r.peso_kg) }));
  bloques.push(panelSerie({ titulo: 'IMC', unidad: 'kg/m²', esPaciente, puntos: puntosIMC(regs), ref: REF_IMC }));
  const glu = regs.filter(r => r.tipo === 'glucosa' && r.glucosa_mgdl != null)
    .map(r => ({ t: r.medido_en, v: Number(r.glucosa_mgdl), ref: refGlucometria(r.glucosa_momento) }))
    .sort((a, b) => new Date(a.t) - new Date(b.t)).slice(-30);
  if (glu.length) {
    const ult = glu[glu.length - 1];
    const dentro = enRango(ult.v, ult.ref);
    bloques.push(`<div class="panel" style="padding-top:12px">
      <strong>Glucometría</strong>
      <div style="margin:4px 0 8px">Último: <strong>${fmt(ult.v)} mg/dL</strong> <span class="nota">(${esc(fechaCorta(ult.t))})</span>
        ${esPaciente ? '' : `<span class="badge" style="color:${dentro ? COLOR_DENTRO : COLOR_FUERA}">${dentro ? 'Dentro del rango' : 'Fuera del rango'}</span>`}</div>
      ${esPaciente && !dentro ? `<div class="ref-nota">${NOTA_REF}</div>` : ''}
      ${svgSerie({ puntos: glu, titulo: 'glucometría', guias: [{ v: 100, t: 'Ayunas' }, { v: 140, t: 'Después de comer' }], colorDe: q => enRango(q.v, q.ref) ? COLOR_DENTRO : COLOR_FUERA })}
      <p class="nota" style="margin:6px 0 0">Rango de referencia: 70 a 99 mg/dL en ayunas o antes de comer; menos de 140 mg/dL después de comer. Cada punto se compara con el momento en que se midió.</p>
    </div>`);
  }
  const hay = bloques.filter(Boolean);
  const titulo = esPaciente ? 'Mis estudios, peso y glucosa' : 'Peso, laboratorio y glucosa';
  return `<h2>${titulo}</h2>${hay.length ? hay.join('') : '<p class="vacio">Aún no hay peso, laboratorio ni glucometrías registrados.</p>'}`;
}

const ordenarDx = lista => lista.slice().sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));

    <details>

function enlazarDiagnosticos(p) {
  state.msgDx = '';
  const msg = document.getElementById('msg-dx');
  document.getElementById('guardar-dx').onclick = async () => {
    const categoria = document.getElementById('dx-cat').value;
    const detalle = document.getElementById('dx-det').value.trim();
    if (!categoria) { msg.className = 'msg error'; msg.textContent = 'Elige el diagnóstico.'; return; }
    if (categoria === 'Otro' && !detalle) { msg.className = 'msg error'; msg.textContent = 'Escribe el diagnóstico en «Detalle».'; return; }
    const fila = { paciente_id: p.id, categoria, detalle: detalle || null, fecha: document.getElementById('dx-fecha').value || null, nota: document.getElementById('dx-nota').value.trim() || null };
    const { error } = await db.from('diagnosticos').insert(fila);
    if (error) { msg.className = 'msg error'; msg.textContent = 'No se pudo guardar: ' + error.message + ' (¿ya ejecutó el archivo SQL de esta actualización?)'; return; }
    await recargarDx();
    state.msgDx = 'Diagnóstico guardado.';
    pintarPaciente();
  };
  document.querySelectorAll('[data-quitar-dx]').forEach(b => b.onclick = async () => {
    if (b.dataset.confirmar !== '1') { b.dataset.confirmar = '1'; b.textContent = 'Toque otra vez para quitar'; return; }
    const { error } = await db.from('diagnosticos').delete().eq('id', b.dataset.quitarDx);
    if (error) { b.textContent = 'No se pudo quitar'; return; }
    await recargarDx();
    state.msgDx = 'Diagnóstico quitado.';
    pintarPaciente();
  });
}

async function recargarDx() {
  const { data } = await db.from('diagnosticos').select('*');
  state.dx = data || [];
}

/* ================== MAPA DE PACIENTES (solo administrador) ================== */
const CENTRO_MANTE = [22.743, -98.9739];
let mapaLeaflet = null, sectorPendiente = null;

function cargarLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((ok, falla) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    s.onload = ok; s.onerror = falla;
    document.head.appendChild(s);
  });
}

function conteoPorSector(filtro) {
  const conteo = {}; let sinSector = 0, total = 0;
  for (const p of state.pacientes) {
    if (filtro && !state.dx.some(d => d.paciente_id === p.id && d.categoria === filtro)) continue;
    total++;
    if (p.sector) conteo[p.sector] = (conteo[p.sector] || 0) + 1; else sinSector++;
  }
  return { conteo, sinSector, total };
}

function colorEscala(t) {
  const paradas = [[245, 197, 66], [240, 140, 46], [198, 40, 40]];
  const u = Math.max(0, Math.min(1, t)) * 2, i = Math.min(1, Math.floor(u)), f = u - i;
  const c = paradas[i].map((v, k) => Math.round(v + (paradas[i + 1][k] - v) * f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function quitarMapa() { if (mapaLeaflet) { mapaLeaflet.remove(); mapaLeaflet = null; } sectorPendiente = null; }

async function pintarMapa() {
  quitarMapa();
  const filtro = state.filtroMapa || '';
  const { conteo, sinSector, total } = conteoPorSector(filtro);
  const maxN = Math.max(1, ...Object.values(conteo));
  const filas = Object.entries(conteo).sort((a, b) => b[1] - a[1]);
  const ubicados = new Set(state.sectores.map(s => s.nombre));
  app.innerHTML = `
    ${encabezado('Administrador')}
    <button id="volver" class="enlace" style="padding-left:0">Volver a pacientes</button>
    <h2 style="margin-top:4px">Mapa de pacientes</h2>
    <label for="filtro-dx">Enfermedad</label>
    <select id="filtro-dx"><option value="">Todos los pacientes</option>${DX_CATEGORIAS.map(c => `<option${c === filtro ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select>
    <div id="mapa" role="region" aria-label="Mapa de Cd. Mante y la región"><p class="vacio" style="padding:16px">Cargando mapa…</p></div>
    <div class="leyenda" style="align-items:center">
      <span>Menos</span><span class="escala"></span><span>Más pacientes</span>
    </div>
    <p class="nota" style="margin:6px 0 0">${filtro ? esc(filtro) + ': ' : ''}${total} paciente(s). ${sinSector ? sinSector + ' sin sector asignado.' : ''}</p>
    <h2>Por sector</h2>
    ${filas.length ? `<table class="tabla"><thead><tr><th>Sector</th><th class="num">Pacientes</th></tr></thead><tbody>
      ${filas.map(([s, n]) => `<tr><td>${esc(s)}${ubicados.has(s) ? '' : ' <span class="nota">(sin ubicar en el mapa)</span>'}</td><td class="num"><strong>${n}</strong></td></tr>`).join('')}
    </tbody></table>` : '<p class="vacio">Ningún paciente tiene sector asignado todavía. Asígnelo en la ficha de cada paciente, o el paciente lo elige al crear su cuenta.</p>'}
    <details${state.sectores.length ? '' : ' open'}>
      <summary>Sectores del mapa (${state.sectores.length})</summary>
      <p>Escriba el nombre de la colonia, sector o localidad, toque «Ubicar en el mapa» y después toque el mapa en el lugar que le corresponde.</p>
      <label for="nuevo-sector">Nombre del sector</label>
      <input id="nuevo-sector" placeholder="Por ejemplo: Zona Centro">
      <div class="msg" id="msg-sector" role="status"></div>
      <button class="primario" id="ubicar-sector">Ubicar en el mapa</button>
      ${state.sectores.length ? `<ul class="lista" style="margin:16px 0 12px">${state.sectores.map(s => `<li class="item"><div class="fila-btn"><span>${esc(s.nombre)}</span><button class="enlace" data-quitar-sector="${s.id}" style="flex:none">Quitar</button></div></li>`).join('')}</ul>` : ''}
    </details>
    <p class="nota" style="margin-top:16px">Solo usted ve este mapa. Muestra cuántos pacientes hay por sector, no domicilios. Evite compartir capturas donde un sector con muy pocos pacientes permita identificarlos.</p>`;

  document.getElementById('salir').onclick = salir;
  document.getElementById('volver').onclick = () => { quitarMapa(); state.vistaAdmin = 'lista'; pintarAdmin(); };
  document.getElementById('filtro-dx').onchange = e => { state.filtroMapa = e.target.value; pintarMapa(); };
  const msgS = document.getElementById('msg-sector');
  document.getElementById('ubicar-sector').onclick = () => {
    const nombre = document.getElementById('nuevo-sector').value.trim();
    if (!nombre) { msgS.className = 'msg error'; msgS.textContent = 'Escriba el nombre del sector.'; return; }
    if (state.sectores.some(s => s.nombre.toLowerCase() === nombre.toLowerCase())) { msgS.className = 'msg error'; msgS.textContent = 'Ese sector ya existe.'; return; }
    sectorPendiente = nombre;
    msgS.className = 'msg ok'; msgS.textContent = `Ahora toque el mapa en el lugar de «${nombre}».`;
    document.getElementById('mapa').scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  document.querySelectorAll('[data-quitar-sector]').forEach(b => b.onclick = async () => {
    if (b.dataset.confirmar !== '1') { b.dataset.confirmar = '1'; b.textContent = 'Toque otra vez para quitar'; return; }
    const { error } = await db.from('sectores').delete().eq('id', b.dataset.quitarSector);
    if (error) { b.textContent = 'No se pudo quitar'; return; }
    await recargarSectores(); pintarMapa();
  });

  try { await cargarLeaflet(); }
  catch (e) { document.getElementById('mapa').innerHTML = '<p class="vacio" style="padding:16px">No se pudo cargar el mapa. Revise su conexión a internet.</p>'; return; }
  const div = document.getElementById('mapa');
  if (!div) return;
  div.innerHTML = '';
  mapaLeaflet = L.map(div).setView(CENTRO_MANTE, 11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(mapaLeaflet);
  const marcas = [];
  for (const s of state.sectores) {
    const n = conteo[s.nombre] || 0;
    const col = n ? colorEscala(n / maxN) : '#8A9BA0';
    const c = L.circleMarker([s.lat, s.lng], { radius: n ? 10 + 16 * Math.sqrt(n / maxN) : 6, color: col, fillColor: col, fillOpacity: n ? 0.6 : 0.3, weight: 2 })
      .addTo(mapaLeaflet)
      .bindTooltip(`${s.nombre}: ${n} paciente(s)`, { permanent: n > 0, direction: 'top', offset: [0, -6] });
    marcas.push(c);
  }
  if (marcas.length > 1) mapaLeaflet.fitBounds(L.featureGroup(marcas).getBounds().pad(0.3), { maxZoom: 14 });
  mapaLeaflet.on('click', async ev => {
    if (!sectorPendiente) return;
    const nombre = sectorPendiente; sectorPendiente = null;
    const { error } = await db.from('sectores').insert({ nombre, lat: ev.latlng.lat, lng: ev.latlng.lng });
    if (error) { msgS.className = 'msg error'; msgS.textContent = 'No se pudo guardar: ' + error.message + ' (¿ya ejecutó el archivo SQL de esta actualización?)'; return; }
    await recargarSectores(); pintarMapa();
  });
  setTimeout(() => { if (mapaLeaflet) mapaLeaflet.invalidateSize(); }, 200);
}

async function recargarSectores() {
  const { data } = await db.from('sectores').select('*').order('nombre');
  state.sectores = data || [];
}

/* ================== ACCESO ================== */
/* Mensajes claros para los errores de acceso (Supabase devuelve textos en inglés). */
function mensajeAcceso(error) {
  const t = String((error && (error.message || error.code)) || '').toLowerCase();
  if (t.includes('email not confirmed') || t.includes('email_not_confirmed')) return { texto: 'Su correo todavía no está confirmado. Abra el mensaje que le enviamos (revise también spam o promociones) y toque el enlace.', reenviar: true };
  if (t.includes('invalid login')) return { texto: 'Correo o contraseña incorrectos. Si es su primera vez, toque «Soy paciente nuevo: crear mi cuenta». Si olvidó su contraseña, toque «Olvidé mi contraseña».' };
  if (t.includes('already registered') || t.includes('already been registered')) return { texto: 'Ese correo ya tiene una cuenta. Toque «Ya tengo cuenta: entrar». Si olvidó su contraseña, use «Olvidé mi contraseña».' };
  if (t.includes('rate limit') || t.includes('too many') || t.includes('over_email')) return { texto: 'Se hicieron demasiados intentos o se enviaron demasiados correos. Espere unos minutos e inténtelo de nuevo, o pida ayuda en el consultorio.' };
  if (t.includes('at least') && t.includes('character')) return { texto: 'La contraseña es muy corta. Use al menos 8 caracteres.' };
  if (t.includes('same password') || t.includes('different from the old')) return { texto: 'Elija una contraseña distinta a la anterior.' };
  if (t.includes('failed to fetch') || t.includes('network')) return { texto: 'No hay conexión a internet. Revise su señal o su Wi-Fi e inténtelo de nuevo.' };
  return { texto: 'No se pudo completar: ' + ((error && error.message) || 'error desconocido') };
}

function vistaAcceso(modo = 'entrar', aviso = '') {
  const reg = modo === 'registro', olv = modo === 'olvide', nue = modo === 'nueva';
  const titulos = { entrar: '', registro: 'Crear mi cuenta', olvide: 'Cambiar mi contraseña', nueva: 'Elija su nueva contraseña' };
  const boton = { entrar: 'Entrar', registro: 'Crear mi cuenta', olvide: 'Enviar enlace por correo', nueva: 'Guardar contraseña' };
  const campoCorreo = `<label for="correo">Correo electrónico</label>
        <input id="correo" type="email" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="email" required>`;
  const campoClave = etiqueta => `<label for="clave">${etiqueta}</label>
        <input id="clave" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="${reg || nue ? 'new-password' : 'current-password'}" required>
        <label class="check" for="ver"><input type="checkbox" id="ver"> Mostrar contraseña</label>`;
  const enlaces = {
    entrar: '<p style="text-align:center;margin:8px 0 0"><button type="button" class="enlace" id="olvide">Olvidé mi contraseña</button></p><button type="button" class="secundario" id="cambiar" style="margin-top:12px">Soy paciente nuevo: crear mi cuenta</button>',
    registro: '<button type="button" class="secundario" id="cambiar" style="margin-top:12px">Ya tengo cuenta: entrar</button>',
    olvide: '<button type="button" class="secundario" id="cambiar" style="margin-top:12px">Volver</button>',
    nueva: ''
  };
  app.innerHTML = `
    <div class="top"><div class="marca"><img class="logo" src="icon-192.png" alt=""><h1>CardioControl Mante</h1></div></div>
    ${consultorioHTML()}
    ${titulos[modo] ? `<h2>${titulos[modo]}</h2>` : ''}
    <div class="panel">
      <form id="f-acceso" novalidate>
        ${reg ? '<label for="nombre">Nombre completo</label><input id="nombre" autocomplete="name" required>' : ''}
        ${reg ? '<label for="reg-sector" id="lbl-sector" hidden>Colonia o localidad donde vive (opcional)</label><select id="reg-sector" hidden><option value="">Prefiero no decir</option></select>' : ''}
        ${nue ? '' : campoCorreo}
        ${olv ? '' : campoClave(reg ? 'Contraseña (mínimo 8 caracteres)' : nue ? 'Nueva contraseña (mínimo 8 caracteres)' : 'Contraseña')}
        <div class="msg error" id="msg" role="alert">${esc(aviso)}</div>
        <button class="primario" type="submit">${boton[modo]}</button>
      </form>
    </div>
    ${enlaces[modo]}
    <p class="nota" style="text-align:center;margin-top:16px">En una urgencia (dolor de pecho, falta de aire, desmayo) llame al ${URGENCIAS.numero}. Esta aplicación no se revisa en tiempo real.</p>`;

  const msg = document.getElementById('msg');
  const mostrar = (texto, ok, correoReenvio) => {
    msg.className = 'msg ' + (ok ? 'ok' : 'error');
    msg.textContent = texto;
    if (correoReenvio) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'enlace'; b.textContent = 'Reenviar correo de confirmación';
      b.onclick = async () => {
        b.disabled = true;
        const { error } = await db.auth.resend({ type: 'signup', email: correoReenvio, options: { emailRedirectTo: urlApp() } });
        mostrar(error ? mensajeAcceso(error).texto : 'Listo. Le enviamos otro correo. Revise también spam o promociones.', !error, '');
      };
      msg.appendChild(document.createElement('br'));
      msg.appendChild(b);
    }
  };

  if (reg) {
    db.from('sectores').select('nombre').order('nombre').then(({ data }) => {
      const sel = document.getElementById('reg-sector');
      if (!sel || !data || !data.length) return;
      sel.insertAdjacentHTML('beforeend', data.map(x => `<option>${esc(x.nombre)}</option>`).join(''));
      sel.hidden = false; document.getElementById('lbl-sector').hidden = false;
    });
  }
  const bOlv = document.getElementById('olvide');
  if (bOlv) bOlv.onclick = () => vistaAcceso('olvide');
  const bCam = document.getElementById('cambiar');
  if (bCam) bCam.onclick = () => vistaAcceso(reg || olv ? 'entrar' : 'registro');
  const ver = document.getElementById('ver');
  if (ver) ver.onchange = () => { document.getElementById('clave').type = ver.checked ? 'text' : 'password'; };

  document.getElementById('f-acceso').onsubmit = async e => {
    e.preventDefault();
    msg.className = 'msg error'; msg.textContent = '';
    const elCorreo = document.getElementById('correo');
    const elClave = document.getElementById('clave');
    const correo = elCorreo ? elCorreo.value.trim().toLowerCase() : '';
    const clave = elClave ? elClave.value : '';

    if (!nue && !/^\S+@\S+\.\S+$/.test(correo)) { mostrar('Escriba su correo completo, por ejemplo nombre@gmail.com.', false); return; }

    if (olv) {
      const { error } = await db.auth.resetPasswordForEmail(correo, { redirectTo: urlApp() });
      if (error) { mostrar(mensajeAcceso(error).texto, false); return; }
      mostrar('Si ese correo tiene una cuenta, le enviamos un enlace para cambiar la contraseña. Revise también spam o promociones.', true);
      return;
    }
    if ((reg || nue) && clave.length < 8) { mostrar('La contraseña debe tener al menos 8 caracteres.', false); return; }
    if (!reg && !nue && !clave) { mostrar('Escriba su contraseña.', false); return; }

    if (nue) {
      const { error } = await db.auth.updateUser({ password: clave });
      if (error) { mostrar(mensajeAcceso(error).texto, false); return; }
      state.recuperando = false;
      const { data } = await db.auth.getSession();
      iniciar(data.session);
      return;
    }
    if (reg) {
      const nombre = document.getElementById('nombre').value.trim();
      if (nombre.length < 3) { mostrar('Escriba su nombre completo.', false); return; }
      const elSector = document.getElementById('reg-sector');
      const sector = elSector && !elSector.hidden ? elSector.value : '';
      const { data, error } = await db.auth.signUp({ email: correo, password: clave, options: { data: { nombre, sector }, emailRedirectTo: urlApp() } });
      if (error) { const m = mensajeAcceso(error); mostrar(m.texto, false, m.reenviar ? correo : ''); return; }
      if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
        mostrar('Ese correo ya tiene una cuenta. Toque «Ya tengo cuenta: entrar». Si olvidó su contraseña, use «Olvidé mi contraseña».', false);
        return;
      }
      if (!data.session) mostrar('Cuenta creada. Le enviamos un correo para confirmarla: ábralo (revise también spam o promociones) y toque el enlace. Después vuelva aquí y toque «Ya tengo cuenta: entrar».', true, correo);
      return;
    }
    const { error } = await db.auth.signInWithPassword({ email: correo, password: clave });
    if (error) { const m = mensajeAcceso(error); mostrar(m.texto, false, m.reenviar ? correo : ''); }
  };
}

async function vistaPaciente() {
  const { data: perfilFresco } = await db.from('profiles').select('*').eq('id', state.user.id).single();

  const { data, error } = await db.from('registros').select('*')
    .eq('paciente_id', state.user.id).order('medido_en', { ascending: false }).limit(300);
  state.regs = error ? [] : data;
  const tallaPrevia = ultimaTalla(state.regs);
  const tipo = TIPOS[state.tipo];

  const campo = ([id, etiqueta, tipoInput, extra]) => {
    if (tipoInput === 'select') {
      return `<label for="${id}">${etiqueta}</label><select id="${id}"><option value="">Elegir…</option>${extra.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`;
    }
    const paso = tipoInput === 'number' ? ` inputmode="decimal" step="${extra || '1'}"` : '';
    return `<label for="${id}">${etiqueta}</label><input id="${id}" type="${tipoInput}"${paso}>`;
  };

  const pestanas = `<div class="tipos" role="group" aria-label="Sección">
      ${[['registrar', 'Anotar'], ['graficas', 'Mis gráficas'], ['diagnosticos', 'Mis diagnósticos'], ['guia', 'Mi guía de cuidados']]
        .map(([k, t]) => `<button data-pest="${k}" aria-pressed="${state.pestana === k}">${t}</button>`).join('')}
    </div>`;
  const enlazarPestanas = () => document.querySelectorAll('[data-pest]').forEach(b => b.onclick = () => { state.pestana = b.dataset.pest; vistaPaciente(); });
  if (state.pestana !== 'registrar') {
    let cuerpo = '';
    if (state.pestana === 'guia') cuerpo = guiaHTML(state.perfil);
    if (state.pestana === 'graficas') cuerpo = presionHTML(state.regs, true) + laboratoriosHTML(state.regs, state.perfil, true) + `<p class="nota" style="margin-top:16px">${FUENTES_REF}</p>`;
    if (state.pestana === 'diagnosticos') {
      const { data: misDx } = await db.from('diagnosticos').select('*').eq('paciente_id', state.user.id);
      cuerpo = diagnosticosPacienteHTML(misDx || []);
    }
    app.innerHTML = `${encabezado(state.perfil.nombre || state.user.email)}${consultorioHTML()}${pestanas}${urgenciaHTML()}${cuerpo}`;
    document.getElementById('salir').onclick = salir;
    enlazarPestanas();
    return;
  }
  app.innerHTML = `
    ${encabezado(state.perfil.nombre || state.user.email)}
    ${consultorioHTML()}
    ${pestanas}
    ${urgenciaHTML()}
    <h2 style="margin-top:20px">¿Qué quieres anotar?</h2>
    <div class="tipos" role="group" aria-label="Tipo de registro">
      ${Object.entries(TIPOS).map(([k, v]) => `<button data-tipo="${k}" aria-pressed="${k === state.tipo}">${k === 'laboratorio' && !tieneMeta(state.perfil) ? 'Laboratorio' : v.t}</button>`).join('')}
    </div>
    <form id="f-reg" class="panel" novalidate>
      ${state.tipo === 'laboratorio' ? metaPacienteHTML(state.perfil) : ''}
      ${camposActivos().map(campo).join('')}
      ${state.tipo === 'peso' ? '<p id="imc-vivo" class="vacio" aria-live="polite" style="margin:12px 0 0"></p>' : ''}
      <label for="medido_en">Fecha y hora${state.tipo === 'palpitaciones' ? ' en que empezaron' : ''}</label>
      <input id="medido_en" type="datetime-local" value="${ahoraLocal()}">
      <label for="notas">Notas (opcional)</label>
      <p class="nota" style="margin:0 0 6px">No se revisan en tiempo real. Si es una urgencia, llame al ${URGENCIAS.numero}.</p>
      <textarea id="notas"></textarea>
      <div class="msg" id="msg" role="status"></div>
      <button class="primario" type="submit">Guardar registro</button>
    </form>
    <h2>Mis últimos registros</h2>
    ${state.regs.length ? `<ul class="lista">${state.regs.slice(0, 40).map(r => itemHTML(r, state.perfil, false, tallaPrevia, true)).join('')}</ul>` : '<p class="vacio">Todavía no has guardado ningún registro.</p>'}
    <p class="vacio" style="margin-top:24px">Si tiene dolor en el pecho, falta de aire intensa o desmayo, no use esta aplicación: llame a emergencias.</p>`;

  document.getElementById('salir').onclick = salir;
  document.querySelectorAll('[data-tipo]').forEach(b => b.onclick = () => { state.tipo = b.dataset.tipo; vistaPaciente(); });
  document.getElementById('f-reg').onsubmit = guardarRegistro;
  if (state.tipo === 'peso') {
    const iPeso = document.getElementById('peso_kg');
    const iTalla = document.getElementById('talla_cm');
    const salida = document.getElementById('imc-vivo');
    const calcular = () => {
      const usaPrevia = iTalla.value === '';
      const v = imc(parseFloat(iPeso.value), usaPrevia ? tallaPrevia : parseFloat(iTalla.value));
      if (v != null) salida.textContent = 'Su IMC: ' + v.toFixed(1) + ' kg/m²' + (usaPrevia ? ' (con su última talla registrada)' : '');
      else salida.textContent = (usaPrevia && tallaPrevia == null) ? 'Escriba su peso y su talla para calcular el IMC.' : '';
    };
    iPeso.oninput = calcular;
    iTalla.oninput = calcular;
    calcular();
  }
  const selLab = document.getElementById('lab_nombre');
  if (selLab) selLab.onchange = () => {
    const l = LABS.find(x => x.n === selLab.value);
    const u = document.getElementById('lab_unidad');
    if (u && l) u.value = l.u;
  };
  enlazarPestanas();
}

async function guardarRegistro(e) {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const fila = { paciente_id: state.user.id, tipo: state.tipo };
  let hayDato = false;
  for (const [id, , tipoInput] of camposActivos()) {
    const v = document.getElementById(id).value.trim();
    if (v === '') continue;
    fila[id] = tipoInput === 'number' ? Number(v) : v;
    if (tipoInput === 'number') hayDato = true;
  }
  if (state.tipo === 'laboratorio') {
    if (fila.lab_nombre === 'Otro') {
      if (!fila.lab_otro) { msg.className = 'msg error'; msg.textContent = 'Escribe el nombre del estudio.'; return; }
      fila.lab_nombre = fila.lab_otro;
    }
    delete fila.lab_otro;
    if (fila.lab_valor != null && !fila.lab_nombre) { msg.className = 'msg error'; msg.textContent = 'Elige el estudio de laboratorio.'; return; }
    if (fila.lab_nombre && fila.lab_valor == null) { msg.className = 'msg error'; msg.textContent = 'Escribe el resultado del estudio.'; return; }
    if (fila.lab_nombre && !fila.lab_unidad) { const l = LABS.find(x => x.n === fila.lab_nombre); if (l) fila.lab_unidad = l.u; }
  }
  if (!hayDato) { msg.className = 'msg error'; msg.textContent = 'Escribe al menos un valor antes de guardar.'; return; }
  const cuando = document.getElementById('medido_en').value;
  fila.medido_en = cuando ? new Date(cuando).toISOString() : new Date().toISOString();
  const notas = document.getElementById('notas').value.trim();
  if (notas) fila.notas = notas;
  const { error } = await db.from('registros').insert(fila);
  if (error) { msg.className = 'msg error'; msg.textContent = 'No se pudo guardar: ' + error.message; return; }
  const posibleSintoma = state.tipo === 'palpitaciones' || (fila.notas && SINTOMAS_RE.test(sinAcentos(fila.notas)));
  const catGuardada = fila.tipo === 'presion' ? categoriaPA(fila.sistolica, fila.diastolica) : null;
  const fueraRef = fueraDeReferencia(fila, state.perfil, ultimaTalla(state.regs)).length > 0;
  await vistaPaciente();
  const nuevo = document.getElementById('msg');
  nuevo.className = 'msg ok'; nuevo.textContent = 'Registro guardado.';
  if (fueraRef) nuevo.innerHTML = 'Registro guardado.<div class="ref-nota">' + NOTA_REF + '</div>' + (catGuardada === 'grave' ? GRAVE_HTML : '');
  if (posibleSintoma) nuevo.innerHTML += '<div style="margin-top:6px"><strong>Esta aplicación no se revisa en tiempo real.</strong> Si tiene dolor de pecho, falta de aire, desmayo o malestar importante, llame al ' + URGENCIAS.numero + ' o acuda a urgencias.</div>';
}

async function cargarDatosAdmin() {
  const [p, r, d, se] = await Promise.all([
    db.from('profiles').select('*').eq('rol', 'paciente').order('nombre'),
    db.from('registros').select('*').order('medido_en', { ascending: false }).limit(3000),
    db.from('diagnosticos').select('*'),
    db.from('sectores').select('*').order('nombre')
  ]);
  state.pacientes = p.data || [];
  state.regs = r.data || [];
  state.dx = d.data || [];
  state.sectores = se.data || [];
}

async function cargarAdmin() { await cargarDatosAdmin(); pintarAdmin(); }

/* Con un registro nuevo se actualizan los datos; no se redibuja si usted está escribiendo o en el mapa. */
async function refrescarAdmin() {
  const ocupado = state.vistaAdmin === 'mapa' || ['INPUT', 'SELECT', 'TEXTAREA'].includes((document.activeElement || {}).tagName);
  await cargarDatosAdmin();
  if (!ocupado) pintarAdmin();
}

function pintarAdmin() {
  if (state.vistaAdmin === 'mapa') return pintarMapa();
  if (state.sel) return pintarPaciente();
  const hace7 = Date.now() - 7 * 864e5;
  const filas = state.pacientes.map(p => {
    const regs = state.regs.filter(x => x.paciente_id === p.id);
    const nAl = regs.filter(x => new Date(x.medido_en).getTime() >= hace7 && alertas(x, p).length).length;
    return { p, regs, nAl };
  }).sort((a, b) => b.nAl - a.nAl);
  app.innerHTML = `
    ${encabezado('Administrador')}
    <div class="invitar">
      <a class="btn-wa" href="${enlaceWhatsApp()}" target="_blank" rel="noopener">Invitar paciente por WhatsApp</a>
      <button id="copiar">Copiar enlace</button>
    </div>
    <button class="secundario" id="ver-mapa" style="margin-bottom:16px">Mapa de pacientes por sector y enfermedad</button>
    <h2 style="margin-top:0">Pacientes (${filas.length})</h2>
    ${filas.length ? `<ul class="lista">${filas.map(({ p, regs, nAl }) => `
      <li><button class="pac item${nAl ? ' alerta' : ''}" data-pac="${p.id}">
        <div class="n">${esc(p.nombre || 'Sin nombre')}</div>
        <div class="d">${regs.length ? 'Último registro: ' + esc(fecha(regs[0].medido_en)) : 'Sin registros'}</div>
        <div class="d">${metaTextoAdmin(p)}</div>
        ${p.riesgo_cv ? `<div class="d">Riesgo cardiovascular: ${esc(p.riesgo_cv)}</div>` : ''}
        ${(() => { const c = [...new Set(state.dx.filter(d => d.paciente_id === p.id).map(d => d.categoria))]; return c.length ? `<div class="d">Diagnósticos: ${esc(c.join(', '))}</div>` : ''; })()}
        ${p.sector ? `<div class="d">Sector: ${esc(p.sector)}</div>` : ''}
        ${nAl ? `<div class="aviso">${nAl} registro(s) con alerta en 7 días</div>` : ''}
      </button></li>`).join('')}</ul>` : '<p class="vacio">Aún no hay pacientes registrados. Comparte el enlace de la app para que creen su cuenta.</p>'}`;
  document.getElementById('salir').onclick = salir;
  document.getElementById('copiar').onclick = copiarEnlace;
  document.getElementById('ver-mapa').onclick = () => { state.vistaAdmin = 'mapa'; pintarMapa(); };
  document.querySelectorAll('[data-pac]').forEach(b => b.onclick = () => { state.sel = b.dataset.pac; pintarAdmin(); });
}

function pintarPaciente() {
  const p = state.pacientes.find(x => x.id === state.sel);
  if (!p) { state.sel = null; return pintarAdmin(); }
  const regs = state.regs.filter(x => x.paciente_id === p.id);
  const tallaRef = ultimaTalla(regs);
  app.innerHTML = `
    ${encabezado('Administrador')}
    <button id="volver" class="enlace" style="padding-left:0">Volver a pacientes</button>
    <h2 style="margin-top:4px">${esc(p.nombre || 'Sin nombre')}</h2>
    ${datosPacienteHTML(p)}
    ${diagnosticosAdminHTML(p)}
    ${presionHTML(regs, false)}
    ${riesgoHTML(p)}
    ${anticoagulacionHTML(p)}
    ${laboratoriosHTML(regs, p, false)}
    <p class="nota" style="margin-top:12px">${FUENTES_REF}</p>
    <h2>Historial</h2>
    ${regs.length ? `<ul class="lista">${regs.slice(0, 100).map(r => itemHTML(r, p, true, tallaRef, false)).join('')}</ul>` : '<p class="vacio">Sin registros.</p>'}`;
  document.getElementById('salir').onclick = salir;
  document.getElementById('volver').onclick = () => { state.sel = null; pintarAdmin(); };
  enlazarAnticoagulacion(p);

}

}

async function copiarEnlace() {
  const b = document.getElementById('copiar');
  try { await navigator.clipboard.writeText(urlApp()); b.textContent = 'Enlace copiado'; }
  catch (e) { b.textContent = urlApp(); }
  setTimeout(() => { if (b) b.textContent = 'Copiar enlace'; }, 2500);
}

let eventoInstalar = null;
const esStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const esIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);

function pintarInstalar() {
  const c = document.getElementById('instalar');
  let oculto = false;
  try { oculto = localStorage.getItem('ocultar_instalar') === '1'; } catch (e) {}
  if (esStandalone() || oculto || (!eventoInstalar && !esIOS())) { c.hidden = true; return; }
  c.hidden = false;
  c.innerHTML = `<div class="panel">
    <strong>Tenga esta app en su celular</strong>
    ${eventoInstalar
      ? '<p>Instálela para abrirla con un toque, como cualquier otra app.</p><button class="primario" id="btn-instalar">Instalar app</button>'
      : '<p>En iPhone: toque el botón Compartir y elija «Agregar a pantalla de inicio».</p>'}
    <button class="enlace" id="btn-ahora-no">Ahora no</button>
  </div>`;
  const bi = document.getElementById('btn-instalar');
  if (bi) bi.onclick = async () => { eventoInstalar.prompt(); await eventoInstalar.userChoice; eventoInstalar = null; pintarInstalar(); };
  document.getElementById('btn-ahora-no').onclick = () => {
    try { localStorage.setItem('ocultar_instalar', '1'); } catch (e) {}
    c.hidden = true;
  };
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); eventoInstalar = e; pintarInstalar(); });
window.addEventListener('appinstalled', () => { eventoInstalar = null; pintarInstalar(); });
pintarInstalar();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ================== ARRANQUE ================== */
async function iniciar(session) {
  if (!session) { state.user = null; state.perfil = null; state.sel = null; return vistaAcceso(); }
  state.user = session.user;
  const { data } = await db.from('profiles').select('*').eq('id', session.user.id).single();
  state.perfil = data || { nombre: '', rol: 'paciente' };
  return state.perfil.rol === 'admin' ? vistaAdmin() : vistaPaciente();
}

db.auth.onAuthStateChange((evento, session) => {
  if (evento === 'TOKEN_REFRESHED') return;
  if (evento === 'PASSWORD_RECOVERY') { state.recuperando = true; setTimeout(() => vistaAcceso('nueva'), 0); return; }
  if (state.recuperando && evento !== 'SIGNED_OUT') return;
  setTimeout(() => iniciar(session), 0);
});
</script>
