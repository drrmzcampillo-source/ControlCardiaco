<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10282F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CardioControl Mante">
<title>CardioControl Mante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F7F7; --card:#FFFFFF; --ink:#10282F; --muted:#587076; --line:#D3DEDF;
  --brand:#0E6E6E; --on-brand:#FFFFFF; --alert:#B4380F; --alert-bg:#FCE9E1; --ok:#2F6B3A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1A1E; --card:#14262B; --ink:#E8F1F2; --muted:#93AAB0; --line:#27414A;
    --brand:#3FB5B0; --on-brand:#06201F; --alert:#FF9A73; --alert-bg:#3A2018; --ok:#7BC58A;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.6rem;line-height:1.2;margin:0}
h2{font-size:1.25rem;margin:28px 0 12px}
p{margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.top .quien{color:var(--muted);font-size:.95rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 16px;min-height:48px}
button.primario{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:700;width:100%}
button.enlace{border:0;background:none;color:var(--brand);padding:8px;min-height:44px;text-decoration:underline}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
textarea{min-height:80px}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tipos button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:700}
.tipos button:last-child:nth-child(odd){grid-column:1/-1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px 18px;margin-top:12px}
.msg{min-height:1.5em;margin-top:12px;font-weight:700}
.msg.error{color:var(--alert)} .msg.ok{color:var(--ok)}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:10px 14px}
.item.alerta{border-left-color:var(--alert);background:var(--alert-bg)}
.item .cuando{color:var(--muted);font-size:.9rem}
.item .que{font-weight:700}
.item .aviso{color:var(--alert);font-weight:700;font-size:.95rem}
.pac{width:100%;text-align:left;display:block}
.pac .n{font-weight:700}
.pac .d{color:var(--muted);font-size:.9rem}
.pac.alerta{border-left:6px solid var(--alert)}
.vacio{color:var(--muted)}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font-size:10px}
.leyenda{display:flex;gap:16px;font-size:.9rem;color:var(--muted);margin-top:4px}
.consultorio{color:var(--muted);font-size:.95rem;margin:0 0 4px}
.consultorio strong{color:var(--ink)}
.consultorio a{color:var(--brand);font-weight:700}
.urgencia{border:1px solid var(--alert);border-left:6px solid var(--alert);background:var(--alert-bg);border-radius:12px;padding:12px 16px;margin:12px 0}
.urgencia p{margin:0 0 10px}
a.btn-911{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:10px;background:var(--alert);color:var(--paper);font-weight:700;text-decoration:none}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin-top:12px}
details.urgente{border-left:6px solid var(--alert)}
summary{font-weight:700;min-height:48px;display:flex;align-items:center;cursor:pointer}
details ul{padding-left:20px;margin:0 0 12px}
details li{margin-bottom:8px}
details h3{font-size:1rem;margin:12px 0 6px}
.nota{color:var(--muted);font-size:.9rem}
.marca{display:flex;align-items:center;gap:12px;min-width:0}
img.logo{width:56px;height:56px;border-radius:14px;flex:none}
.instalar{max-width:640px;margin:0 auto;padding:16px 16px 0}
.instalar .panel{margin-top:0;padding-top:16px}
.instalar p{margin:6px 0 12px}
.invitar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:16px}
a.btn-wa{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border-radius:10px;background:var(--brand);color:var(--on-brand);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div id="instalar" class="instalar" hidden></div>
<div id="app"><p class="vacio">Cargando…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
/* ================== CONFIGURACIÓN ================== */
const SUPABASE_URL = 'https://weifxnszhirnmsxsfago.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Zb-xmUeyX1BB6aVBxCAT2w_5-5xMyJO';

/* Datos del médico y del consultorio que ven los pacientes. Cámbialos aquí si quieres. */
const MEDICO = { nombre: 'Dr. Rodolfo Ramírez Campillo', especialidad: 'Cardiología', consultorio: 'Consultorio Cardiología Mante', telefono: '831 241 7049', nota: 'Previa cita' };

/* Número de emergencias y detector sencillo de síntomas de alarma en las notas del paciente. */
const URGENCIAS = { numero: '911' };
const sinAcentos = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const SINTOMAS_RE = /(dolor|duele|duelen|molestia|presion|opresion)[^.]{0,25}pecho|dolor toracico|opresion|falta(n)? (el |de )?aire|ahogo|no puedo respirar|dificultad para respirar|desmay|sincope|perdi el conocimiento|perdida de (la )?conciencia|marea|mareo|palpitacion|taquicardia|sudor frio|confus|desorient|sangrad|sangre|hemorrag/i;

/* Umbrales de alerta para el panel del administrador.
   Ajústalos a tu criterio clínico: [mínimo, máximo]. */
const LIM = {
  sistolica: [90, 180],
  diastolica: [50, 110],
  pulso: [45, 120],
  glucosa: [70, 250],
  inr: [1.5, 4.0],
  palpitacionesMin: 30   // minutos de duración que se marcan como alerta
};

/* ================== UTILIDADES ================== */
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ahoraLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const fecha = iso => new Date(iso).toLocaleString('es', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
const state = { user:null, perfil:null, tipo:'presion', pestana:'registrar', modoRegistro:false, pacientes:[], regs:[], sel:null, canal:null };

const TIPOS = {
  presion: { t:'Presión y pulso', campos:[
    ['sistolica','Sistólica (mmHg)','number'],['diastolica','Diastólica (mmHg)','number'],['pulso','Pulso (latidos por minuto)','number'] ] },
  peso: { t:'Peso y talla', campos:[
    ['peso_kg','Peso (kg)','number','0.1'],['talla_cm','Talla (cm)','number','0.1'] ] },
  palpitaciones: { t:'Palpitaciones', campos:[
    ['palp_duracion_min','Duración (minutos)','number'],['palp_episodios','Episodios en el día','number'],['pulso','Pulso durante el episodio (lpm)','number'] ] },
  glucosa: { t:'Glucosa', campos:[
    ['glucosa_mgdl','Glucosa (mg/dL)','number'],
    ['glucosa_momento','¿Cuándo la midió?','select',[['ayuno','En ayunas'],['antes_comida','Antes de comer'],['despues_comida','Después de comer'],['otro','Otro momento']]] ] },
  laboratorio: { t:'Laboratorio e INR', campos:[
    ['inr','INR (control anticoagulante)','number','0.1'],
    ['lab_nombre','Estudio de laboratorio','select',[['Creatinina sérica','Creatinina sérica'],['NT-proBNP','NT-proBNP'],['HbA1c','HbA1c'],['Glucosa (laboratorio)','Glucosa (laboratorio)'],['Colesterol total','Colesterol total'],['Triglicéridos','Triglicéridos'],['HDL','HDL'],['LDL','LDL'],['Otro','Otro (escribir el nombre)']]],
    ['lab_otro','Nombre del estudio (solo si eligió Otro)','text'],
    ['lab_valor','Resultado','number','any'],['lab_unidad','Unidad','text'] ] }
};

function resumen(r) {
  switch (r.tipo) {
    case 'presion': return `${r.sistolica ?? '—'}/${r.diastolica ?? '—'} mmHg, pulso ${r.pulso ?? '—'}`;
    case 'peso': return [r.peso_kg != null ? r.peso_kg + ' kg' : null, r.talla_cm != null ? r.talla_cm + ' cm' : null].filter(Boolean).join(', ');
    case 'palpitaciones': return `Palpitaciones: ${r.palp_duracion_min ?? '—'} min, ${r.palp_episodios ?? '—'} episodio(s)` + (r.pulso != null ? `, pulso ${r.pulso}` : '');
    case 'glucosa': return `Glucosa ${r.glucosa_mgdl} mg/dL (${({ayuno:'en ayunas',antes_comida:'antes de comer',despues_comida:'después de comer',otro:'otro momento'})[r.glucosa_momento] || '—'})`;
    case 'laboratorio': return [r.inr != null ? 'INR ' + r.inr : null, r.lab_nombre ? `${r.lab_nombre} ${r.lab_valor ?? ''} ${r.lab_unidad ?? ''}`.trim() : null].filter(Boolean).join(', ');
  }
  return '';
}

function alertas(r, p) {
  const a = [];
  const fuera = (v, [lo, hi], n) => { if (v != null && (v < lo || v > hi)) a.push(`${n} ${v}`); };
  fuera(r.sistolica, LIM.sistolica, 'Sistólica');
  fuera(r.diastolica, LIM.diastolica, 'Diastólica');
  fuera(r.pulso, LIM.pulso, 'Pulso');
  fuera(r.glucosa_mgdl, LIM.glucosa, 'Glucosa');
  if (r.inr != null) {
    if (p && p.inr_min != null && p.inr_max != null) fuera(r.inr, [Number(p.inr_min), Number(p.inr_max)], 'INR');
    else if (!(p && p.indicacion)) fuera(r.inr, LIM.inr, 'INR');
  }
  if (r.palp_duracion_min != null && r.palp_duracion_min >= LIM.palpitacionesMin) a.push(`Palpitaciones de ${r.palp_duracion_min} min`);
  if (r.notas && SINTOMAS_RE.test(sinAcentos(r.notas))) a.push('Notas con posible síntoma de alarma');
  if (r.tipo === 'laboratorio' && r.lab_nombre === 'LDL' && r.lab_valor != null && p && LDL_META[p.riesgo_cv] != null && Number(r.lab_valor) >= LDL_META[p.riesgo_cv]) {
    a.push(`LDL ${r.lab_valor} (meta menor de ${LDL_META[p.riesgo_cv]})`);
  }
  return a;
}

const consultorioHTML = () => `<div class="consultorio">
  <strong>${esc(MEDICO.nombre)}</strong>, ${esc(MEDICO.especialidad)}<br>
  ${esc(MEDICO.consultorio)}<br>
  Tel. <a href="tel:${MEDICO.telefono.replace(/\D/g, '')}">${esc(MEDICO.telefono)}</a>, ${esc(MEDICO.nota.toLowerCase())}
</div>`;

const urgenciaHTML = () => `<div class="urgencia" role="note">
  <p><strong>¿Es una urgencia?</strong> Dolor de pecho, falta de aire, desmayo o alteración de la conciencia, palpitaciones intensas o malestar general importante: no espere respuesta por aquí. Llame al ${URGENCIAS.numero} o acuda a urgencias.</p>
  <a class="btn-911" href="tel:${URGENCIAS.numero}">Llamar al ${URGENCIAS.numero}</a>
  <p class="nota" style="margin:10px 0 0">Esta aplicación no se revisa en tiempo real.</p>
</div>`;

function itemHTML(r, p, verAlertas) {
  const al = verAlertas ? alertas(r, p) : [];
  return `<li class="item${al.length ? ' alerta' : ''}">
    <div class="cuando">${esc(fecha(r.medido_en))}</div>
    <div class="que">${esc(resumen(r))}</div>
    ${r.notas ? `<div>${esc(r.notas)}</div>` : ''}
    ${al.length ? `<div class="aviso">Alerta: ${esc(al.join(', '))}</div>` : ''}
  </li>`;
}

/* ================== META DE INR, RIESGO Y LABORATORIO ================== */
/* INR: ACC/AHA 2020 (valvulopatías), ESC/EACTS 2021 y guías de FA. El médico decide la meta de cada paciente. */
const PRESETS = [
  { id: '', t: 'Sin definir' },
  { id: 'ninguno', t: 'No toma anticoagulante' },
  { id: 'doac', t: 'Anticoagulante directo (inhibidor del factor Xa o dabigatrán): sin INR', alias: 'Anticoagulante directo (sin control de INR)' },
  { id: 'fa_vka', t: 'Fibrilación auricular con warfarina', min: 2.0, max: 3.0 },
  { id: 'em_fa', t: 'Estenosis mitral reumática moderada o grave con FA', min: 2.0, max: 3.0 },
  { id: 'mec_ao', t: 'Prótesis mecánica aórtica, sin factores de riesgo', min: 2.0, max: 3.0 },
  { id: 'mec_ao_fr', t: 'Prótesis mecánica aórtica, con factores de riesgo', min: 2.5, max: 3.5 },
  { id: 'mec_mi', t: 'Prótesis mecánica mitral o tricuspídea', min: 2.5, max: 3.5 },
  { id: 'bio', t: 'Bioprótesis quirúrgica (primeros 3 a 6 meses)', min: 2.0, max: 3.0 },
  { id: 'onx', t: 'Prótesis aórtica On-X (después de 3 meses)', min: 1.5, max: 2.0 },
  { id: 'otro', t: 'Personalizado' }
];

/* Estudios de laboratorio con gráfica. Unidades en mg/dL salvo indicación. */
const LABS = [
  { n: 'Creatinina sérica', u: 'mg/dL' },
  { n: 'NT-proBNP', u: 'pg/mL' },
  { n: 'HbA1c', u: '%' },
  { n: 'Glucosa (laboratorio)', u: 'mg/dL' },
  { n: 'Colesterol total', u: 'mg/dL' },
  { n: 'Triglicéridos', u: 'mg/dL' },
  { n: 'HDL', u: 'mg/dL' },
  { n: 'LDL', u: 'mg/dL' }
];

/* Riesgo cardiovascular y meta de LDL (ESC/EAS 2019), en mg/dL: se alerta si el LDL es igual o mayor. */
const RIESGOS = ['Bajo', 'Moderado', 'Alto', 'Muy alto'];
const LDL_META = { 'Bajo': 116, 'Moderado': 100, 'Alto': 70, 'Muy alto': 55 };

const tieneMeta = p => p && p.inr_min != null && p.inr_max != null;
const rangoTexto = p => Number(p.inr_min).toFixed(1) + ' a ' + Number(p.inr_max).toFixed(1);
const fmt = v => String(Math.round(v * 100) / 100);
const fechaCorta = iso => new Date(iso).toLocaleDateString('es', { day: 'numeric', month: 'short', year: '2-digit' });

function grupoAnticoag(p) {
  p = p || {};
  if (tieneMeta(p)) return 'vka';
  const x = p.indicacion ? PRESETS.find(z => z.id && (z.t === p.indicacion || z.alias === p.indicacion)) : null;
  if (x && x.id === 'doac') return 'doac';
  if (x && x.id === 'ninguno') return 'ninguno';
  return 'sin';
}

function camposActivos() {
  return TIPOS[state.tipo].campos.filter(c => !(c[0] === 'inr' && !tieneMeta(state.perfil)));
}

function metaTextoAdmin(p) {
  if (tieneMeta(p)) return 'Meta de INR ' + rangoTexto(p);
  if (p.indicacion) return esc(p.indicacion);
  return 'Anticoagulación sin definir';
}

function metaPacienteHTML(p) {
  return tieneMeta(p) ? `<p style="margin:16px 0 0">Su meta de INR, indicada por su médico: <strong>${rangoTexto(p)}</strong></p>` : '';
}

/* ---------- Administrador: anticoagulación ---------- */
function anticoagulacionHTML(p) {
  const sel = (p.indicacion ? PRESETS.find(x => x.id && (x.t === p.indicacion || x.alias === p.indicacion)) : null) || (p.indicacion ? PRESETS.find(x => x.id === 'otro') : PRESETS[0]);
  return `<h2>Anticoagulación</h2>
  <div class="panel" style="padding-top:12px">
    <label for="indic">Indicación</label>
    <select id="indic">${PRESETS.map(x => `<option value="${x.id}"${x === sel ? ' selected' : ''}>${esc(x.t)}</option>`).join('')}</select>
    <label for="imin">INR mínimo</label>
    <input id="imin" type="number" inputmode="decimal" step="0.1" value="${p.inr_min ?? ''}">
    <label for="imax">INR máximo</label>
    <input id="imax" type="number" inputmode="decimal" step="0.1" value="${p.inr_max ?? ''}">
    <p class="nota" style="margin-top:12px">Metas de referencia según ACC/AHA 2020, ESC/EACTS 2021 y guías de fibrilación auricular. Para prótesis de mayor trombogenicidad o riesgo individual alto, use Personalizado. Con «No toma anticoagulante» o un anticoagulante directo el paciente no verá el campo de INR.</p>
    <div class="msg" id="msg-inr" role="status"></div>
    <button class="primario" id="guardar-inr">Guardar</button>
  </div>`;
}

function enlazarAnticoagulacion(p) {
  const selI = document.getElementById('indic');
  const iMin = document.getElementById('imin');
  const iMax = document.getElementById('imax');
  const msg = document.getElementById('msg-inr');
  const sinINR = () => ['', 'ninguno', 'doac'].includes(selI.value);
  const ajustar = () => { iMin.disabled = iMax.disabled = sinINR(); };
  selI.onchange = () => {
    const x = PRESETS.find(z => z.id === selI.value);
    if (x && x.min != null) { iMin.value = x.min.toFixed(1); iMax.value = x.max.toFixed(1); }
    if (sinINR()) { iMin.value = ''; iMax.value = ''; }
    ajustar();
  };
  ajustar();
  document.getElementById('guardar-inr').onclick = async () => {
    const x = PRESETS.find(z => z.id === selI.value);
    let min = null, max = null;
    if (!sinINR()) {
      min = parseFloat(iMin.value); max = parseFloat(iMax.value);
      if (!(min >= 1 && max <= 5 && min < max)) { msg.className = 'msg error'; msg.textContent = 'Escribe un rango válido, por ejemplo 2.0 a 3.0.'; return; }
    }
    const indicacion = x && x.id ? x.t : null;
    const { error } = await db.from('profiles').update({ inr_min: min, inr_max: max, indicacion }).eq('id', p.id);
    if (error) { msg.className = 'msg error'; msg.textContent = 'No se pudo guardar: ' + error.message; return; }
    p.inr_min = min; p.inr_max = max; p.indicacion = indicacion;
    msg.className = 'msg ok'; msg.textContent = 'Guardado.';
  };
}

/* ---------- Administrador: riesgo cardiovascular ---------- */
function riesgoHTML(p) {
  return `<h2>Riesgo cardiovascular</h2>
  <div class="panel" style="padding-top:12px">
    <label for="riesgo">Categoría de riesgo</label>
    <select id="riesgo"><option value="">Sin definir</option>${RIESGOS.map(x => `<option value="${x}"${x === p.riesgo_cv ? ' selected' : ''}>${x}</option>`).join('')}</select>
    <p class="nota" style="margin-top:12px">Meta de LDL según ESC/EAS 2019: Bajo, menos de 116 mg/dL. Moderado, menos de 100. Alto, menos de 70. Muy alto, menos de 55. En Alto y Muy alto, además, una reducción de al menos 50% respecto al valor inicial. Tú asignas la categoría; la app no la calcula.</p>
    <div class="msg" id="msg-riesgo" role="status"></div>
    <button class="primario" id="guardar-riesgo">Guardar riesgo</button>
  </div>
  <details>
    <summary>Criterios de referencia (ESC/EAS 2019)</summary>
    <ul>
      <li><strong>Muy alto:</strong> enfermedad cardiovascular aterosclerótica documentada; diabetes con daño de órgano blanco, 3 o más factores de riesgo mayores o diabetes tipo 1 de más de 20 años; enfermedad renal crónica grave (TFGe menor de 30); SCORE de 10% o más; hipercolesterolemia familiar con enfermedad cardiovascular.</li>
      <li><strong>Alto:</strong> un solo factor muy elevado (colesterol total mayor de 310 mg/dL, LDL mayor de 190 mg/dL o presión de 180/110 o más); hipercolesterolemia familiar sin otros factores; diabetes de 10 años o más, o con otro factor de riesgo; enfermedad renal crónica moderada (TFGe de 30 a 59); SCORE de 5% a menos de 10%.</li>
      <li><strong>Moderado:</strong> diabetes en jóvenes (tipo 1 menor de 35 años, tipo 2 menor de 50) con menos de 10 años de evolución y sin otros factores; SCORE de 1% a menos de 5%.</li>
      <li><strong>Bajo:</strong> SCORE menor de 1%.</li>
    </ul>
  </details>`;
}

function enlazarRiesgo(p) {
  const msg = document.getElementById('msg-riesgo');
  document.getElementById('guardar-riesgo').onclick = async () => {
    const v = document.getElementById('riesgo').value || null;
    const { error } = await db.from('profiles').update({ riesgo_cv: v }).eq('id', p.id);
    if (error) { msg.className = 'msg error'; msg.textContent = 'No se pudo guardar: ' + error.message; return; }
    p.riesgo_cv = v;
    msg.className = 'msg ok'; msg.textContent = 'Guardado.';
  };
}

/* ---------- Administrador: gráficas de laboratorio ---------- */
function puntosDe(regs, filtro, valor) {
  return regs.filter(filtro)
    .map(r => ({ t: r.medido_en, v: Number(valor(r)) }))
    .filter(q => Number.isFinite(q.v))
    .sort((a, b) => new Date(a.t) - new Date(b.t))
    .slice(-30);
}

function serieGrafica(titulo, unidad, puntos, refs, textoMeta) {
  if (!puntos.length) return '';
  refs = refs || [];
  const ult = puntos[puntos.length - 1];
  let grafico = '<p class="vacio">Con un segundo resultado aparecerá la gráfica.' + (textoMeta ? ' ' + esc(textoMeta) + '.' : '') + '</p>';
  if (puntos.length >= 2) {
    const W = 320, H = 130, m = 28;
    const vals = puntos.map(q => q.v).concat(refs);
    let min = Math.min(...vals), max = Math.max(...vals);
    if (max === min) { max += 1; min -= 1; }
    const pad = (max - min) * 0.1; min -= pad; max += pad;
    const x = i => m + i * (W - m * 1.5) / (puntos.length - 1);
    const y = v => H - m + 4 - (v - min) * (H - m * 1.6) / (max - min);
    const linea = puntos.map((q, i) => `${x(i).toFixed(1)},${y(q.v).toFixed(1)}`).join(' ');
    const circulos = puntos.map((q, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(q.v).toFixed(1)}" r="3" fill="var(--brand)"/>`).join('');
    const guias = refs.map(v => `<line x1="${m}" x2="${W}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--alert)" stroke-dasharray="2 4" opacity=".7"/>`).join('');
    grafico = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tendencia de ${esc(titulo)}">
      <text x="2" y="${y(max - pad).toFixed(0)}">${fmt(max - pad)}</text>
      <text x="2" y="${y(min + pad).toFixed(0)}">${fmt(min + pad)}</text>
      ${guias}<polyline points="${linea}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>${circulos}
    </svg>
    <div class="leyenda"><span>${esc(fechaCorta(puntos[0].t))}</span><span>${esc(fechaCorta(ult.t))}</span>${textoMeta ? `<span>${esc(textoMeta)}</span>` : ''}</div>`;
  }
  return `<div class="panel" style="padding-top:12px">
    <strong>${esc(titulo)}</strong>
    <div style="margin:4px 0 8px">Último: <strong>${fmt(ult.v)} ${esc(unidad)}</strong> <span class="nota">(${esc(fechaCorta(ult.t))})</span></div>
    ${grafico}
  </div>`;
}

function laboratoriosHTML(regs, p) {
  const bloques = [];
  if (tieneMeta(p)) {
    bloques.push(serieGrafica('INR', '', puntosDe(regs, r => r.inr != null, r => r.inr), [Number(p.inr_min), Number(p.inr_max)], 'Meta ' + rangoTexto(p)));
  }
  for (const l of LABS) {
    const meta = l.n === 'LDL' && LDL_META[p.riesgo_cv] != null ? [LDL_META[p.riesgo_cv]] : [];
    bloques.push(serieGrafica(l.n, l.u, puntosDe(regs, r => r.tipo === 'laboratorio' && r.lab_nombre === l.n, r => r.lab_valor), meta, meta.length ? 'Meta menor de ' + meta[0] : ''));
  }
  bloques.push(serieGrafica('Glucometría', 'mg/dL', puntosDe(regs, r => r.tipo === 'glucosa', r => r.glucosa_mgdl), [], ''));
  const hay = bloques.filter(Boolean);
  return `<h2>Laboratorio y glucosa</h2>${hay.length ? hay.join('') : '<p class="vacio">Aún no hay resultados de laboratorio ni glucometrías.</p>'}`;
}

/* ---------- Paciente: guía de cuidados ---------- */
function guiaHTML(p) {
  p = p || {};
  const g = grupoAnticoag(p);
  const anti = g === 'vka' || g === 'doac';
  const li = lista => lista.filter(Boolean).map(x => `<li>${x}</li>`).join('');

  const urgente = li([
    anti && 'Sangrado que no se detiene después de 10 minutos de presión firme.',
    anti && 'Vómito con sangre o con aspecto de café molido; heces negras o con sangre; orina roja o color café.',
    anti && 'Tos con sangre, o sangrado de nariz o encías que no cede.',
    anti && 'Dolor de cabeza muy intenso y repentino, o un golpe fuerte en la cabeza aunque se sienta bien.',
    'Cara caída, debilidad o adormecimiento de un brazo o pierna (sobre todo de un solo lado), dificultad para hablar o entender, pérdida súbita de la visión o mareo con pérdida del equilibrio. Puede ser una embolia o un derrame cerebral.',
    'Dolor de pecho, falta de aire intensa o desmayo.',
    'Pierna o brazo hinchado, caliente y doloroso.',
    'Palpitaciones que no se quitan, con mareo, falta de aire o desmayo.',
    'Confusión, desorientación, mucho sueño o dificultad para despertar, o malestar general importante.',
    g === 'vka' && 'Si tiene una válvula mecánica: que deje de oír el clic habitual o que cambie de forma notable. Acuda ese mismo día.'
  ]);

  const avisar = li([
    anti && 'Moretones grandes sin causa o sangrado leve que se repite (encías, nariz).',
    anti && 'Menstruación más abundante de lo normal.',
    'Aumento de peso de más de 2 kg en 3 días, hinchazón de piernas o más falta de aire de lo habitual.',
    'Diarrea o vómito de más de un día, o fiebre que no se quita.',
    anti && 'Olvido de varias dosis, o un medicamento nuevo.'
  ]);

  const meta = tieneMeta(p)
    ? `<p>Su meta de INR, indicada por su médico, es de <strong>${rangoTexto(p)}</strong>.</p>`
    : '<p>Su médico todavía no ha registrado su meta de INR en la aplicación. Pregúntele cuál es.</p>';

  const seccionINR = g === 'vka' ? `
  <details open>
    <summary>Mi meta de INR y mis controles</summary>
    ${meta}
    <ul>
      <li>El INR mide cuánto tarda su sangre en coagular. Si está por debajo de su meta hay más riesgo de coágulos; si está por encima, hay más riesgo de sangrado.</li>
      <li>Al empezar el tratamiento o cambiar la dosis, el control es cada pocos días hasta que se estabilice, y después suele ser cada semana. Con el INR estable, normalmente es cada 4 semanas. Su médico puede espaciar los controles si lleva mucho tiempo estable.</li>
      <li>No espere a la fecha del control y avise a su médico si tuvo diarrea, vómito, fiebre, cambió de medicamentos o cambió su alimentación.</li>
      <li>Puede medirse en laboratorio (sangre de la vena) o con un coagulómetro portátil (una gota de sangre del dedo). Pregunte a su médico cuál le conviene y cada cuándo.</li>
      <li>Anote cada resultado en esta aplicación, en «Laboratorio e INR», con fecha y hora.</li>
      <li>Lleve siempre una tarjeta o una foto con el nombre de su anticoagulante, la dosis, su meta de INR y el teléfono de su médico.</li>
    </ul>
  </details>` : '';

  const seccionDOAC = g === 'doac' ? `
  <details open>
    <summary>Mi anticoagulante</summary>
    <ul>
      <li>Su anticoagulante es de acción directa. No necesita medirse el INR.</li>
      <li>Tómelo a las mismas horas todos los días, como se lo indicó su médico. No se salte dosis: su efecto dura pocas horas.</li>
      <li>Algunos se toman con alimentos; siga la indicación de su receta.</li>
      <li>Su médico le pedirá estudios de sangre periódicos (función del riñón y hemoglobina). Puede anotar los resultados en «Laboratorio».</li>
      <li>No suspenda ni cambie la dosis por su cuenta, ni antes de un procedimiento sin que su cardiólogo se lo indique.</li>
      <li>Lleve siempre una tarjeta o una foto con el nombre de su anticoagulante, la dosis y el teléfono de su médico.</li>
    </ul>
  </details>` : '';

  const aviso = g === 'sin'
    ? '<p class="nota" style="margin-top:12px">Su médico todavía no ha registrado su tratamiento en la aplicación. Cuando lo haga, verá aquí la información que le corresponde.</p>'
    : '';

  const cuidados = li([
    anti && 'Tome su anticoagulante a la misma hora todos los días. No cambie la dosis ni lo suspenda por su cuenta.',
    g === 'vka' && 'Si olvida una dosis, tómela el mismo día en cuanto lo recuerde. Si ya es el día siguiente, no la duplique y avise a su médico.',
    g === 'doac' && 'Si olvida una dosis, siga la indicación que le dio su médico o su farmacéutico. En general, no se toma doble dosis para compensar.',
    anti && 'No tome aspirina, ibuprofeno, naproxeno, diclofenaco ni otros antiinflamatorios, a menos que su cardiólogo lo indique.',
    anti && 'Pregunte antes de tomar cualquier medicamento para el dolor.' + (g === 'vka' ? ' El paracetamol suele preferirse, pero en dosis altas o diarias también puede subir el INR.' : ''),
    anti && 'Antes de tomar un medicamento nuevo, antibiótico, suplemento, producto naturista o té medicinal, consulte a su médico o farmacéutico. Pueden cambiar el efecto del anticoagulante.',
    'Tome sus demás medicamentos del corazón como se los indicó su cardiólogo y no los suspenda por su cuenta.',
    'Evite el alcohol o limítelo al mínimo.',
    anti && 'Evite deportes de contacto, use casco en bicicleta o moto y cuide no caerse. Use cepillo dental suave y rastrillo eléctrico.',
    anti && 'Avise que toma anticoagulante a todo dentista, cirujano o servicio de urgencias. No suspenda el anticoagulante antes de un procedimiento sin que su cardiólogo se lo indique.',
    anti && 'Si tiene una prótesis valvular, pregunte a su cardiólogo si necesita antibiótico antes de procedimientos dentales y mantenga buena higiene bucal.',
    anti && 'Si es mujer en edad fértil: los anticoagulantes pueden dañar al bebé. Avise de inmediato a su médico si planea embarazarse o cree estarlo.',
    'Acuda a sus consultas y estudios de laboratorio en las fechas indicadas.'
  ]);

  const alimentacion = li([
    g === 'vka' && 'No necesita dejar las verduras. Lo importante es comer cantidades parecidas de alimentos ricos en vitamina K cada semana, porque la vitamina K contrarresta a la warfarina.',
    g === 'vka' && 'Ricos en vitamina K: espinaca, acelga, quelites, col, brócoli, coles de Bruselas, lechuga verde, perejil y cilantro.',
    g === 'vka' && 'Evite cambios bruscos: no empiece de repente licuados verdes diarios, dietas de moda ni ayunos prolongados. Si va a cambiar su forma de comer, avise para vigilar el INR.',
    g === 'vka' && 'Consulte a su médico antes de consumir con frecuencia grandes cantidades de jugo de arándano, toronja, mango, té verde, suplementos o vitaminas (en especial con vitamina K).',
    g === 'doac' && 'No necesita evitar verduras ni cambiar su alimentación por este anticoagulante.',
    'Reduzca la sal y los alimentos ultraprocesados, sobre todo si tiene insuficiencia cardiaca o presión alta.',
    g === 'vka' && 'Si tiene diarrea, vómito o come mucho menos de lo habitual por más de un día, avise: puede subir el INR.',
    g === 'doac' && 'Si tiene diarrea, vómito o se deshidrata por más de un día, avise: puede afectar al riñón y el efecto del medicamento.'
  ]);

  return `
  <p class="nota" style="margin-top:16px">Información general para su cuidado. No sustituye las indicaciones de su cardiólogo: si algo de aquí es distinto a lo que él le indicó, siga lo que él le indicó.</p>${aviso}

  <details class="urgente" open>
    <summary>Signos de alarma</summary>
    <h3>Llame al ${URGENCIAS.numero} o acuda de inmediato a urgencias si tiene:</h3>
    <ul>${urgente}</ul>
    <h3>Avise a su médico en las próximas 24 horas si tiene:</h3>
    <ul>${avisar}</ul>
  </details>
  ${seccionINR}${seccionDOAC}
  <details>
    <summary>Cuidados diarios</summary>
    <ul>${cuidados}</ul>
  </details>

  <details>
    <summary>Alimentación</summary>
    <ul>${alimentacion}</ul>
  </details>`;
}

function vistaAcceso(modo = 'entrar', error = '') {
  const reg = modo === 'registro';
  app.innerHTML = `
    <div class="top"><div class="marca"><img class="logo" src="icon-192.png" alt=""><h1>CardioControl Mante</h1></div></div>
    ${consultorioHTML()}
    <div class="panel">
      <form id="f-acceso" novalidate>
        ${reg ? `<label for="nombre">Nombre completo</label><input id="nombre" autocomplete="name" required>` : ''}
        <label for="correo">Correo electrónico</label>
        <input id="correo" type="email" autocomplete="email" required>
        <label for="clave">Contraseña${reg ? ' (mínimo 8 caracteres)' : ''}</label>
        <input id="clave" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" required>
        <div class="msg error" id="msg" role="alert">${esc(error)}</div>
        <button class="primario" type="submit">${reg ? 'Crear mi cuenta' : 'Entrar'}</button>
      </form>
    </div>
    <p style="text-align:center;margin-top:12px">
      <button class="enlace" id="cambiar">${reg ? 'Ya tengo cuenta: entrar' : 'Primera vez: crear mi cuenta'}</button>
    </p>
    <p class="nota" style="text-align:center">En una urgencia (dolor de pecho, falta de aire, desmayo) llame al ${URGENCIAS.numero}. Esta aplicación no se revisa en tiempo real.</p>`;
  document.getElementById('cambiar').onclick = () => vistaAcceso(reg ? 'entrar' : 'registro');
  document.getElementById('f-acceso').onsubmit = async e => {
    e.preventDefault();
    const correo = document.getElementById('correo').value.trim();
    const clave = document.getElementById('clave').value;
    const msg = document.getElementById('msg');
    msg.textContent = '';
    if (reg) {
      const nombre = document.getElementById('nombre').value.trim();
      if (!nombre) { msg.textContent = 'Escribe tu nombre completo.'; return; }
      const { data, error } = await db.auth.signUp({ email: correo, password: clave, options: { data: { nombre } } });
      if (error) { msg.textContent = 'No se pudo crear la cuenta: ' + error.message; return; }
      if (!data.session) { msg.className = 'msg ok'; msg.textContent = 'Cuenta creada. Revisa tu correo para confirmarla y luego entra.'; }
    } else {
      const { error } = await db.auth.signInWithPassword({ email: correo, password: clave });
      if (error) msg.textContent = 'Correo o contraseña incorrectos.';
    }
  };
}

/* ================== PACIENTE ================== */
async function vistaPaciente() {
  const { data: perfilFresco } = await db.from('profiles').select('*').eq('id', state.user.id).single();
  if (perfilFresco) state.perfil = perfilFresco;
  const { data, error } = await db.from('registros').select('*')
    .eq('paciente_id', state.user.id).order('medido_en', { ascending: false }).limit(40);
  state.regs = error ? [] : data;
  const tipo = TIPOS[state.tipo];

  const campo = ([id, etiqueta, tipoInput, extra]) => {
    if (tipoInput === 'select') {
      return `<label for="${id}">${etiqueta}</label><select id="${id}"><option value="">Elegir…</option>${extra.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`;
    }
    const paso = tipoInput === 'number' ? ` inputmode="decimal" step="${extra || '1'}"` : '';
    return `<label for="${id}">${etiqueta}</label><input id="${id}" type="${tipoInput}"${paso}>`;
  };

  const pestanas = `<div class="tipos" role="group" aria-label="Sección">
      <button data-pest="registrar" aria-pressed="${state.pestana === 'registrar'}">Anotar</button>
      <button data-pest="guia" aria-pressed="${state.pestana === 'guia'}">Mi guía de cuidados</button>
    </div>`;
  const enlazarPestanas = () => document.querySelectorAll('[data-pest]').forEach(b => b.onclick = () => { state.pestana = b.dataset.pest; vistaPaciente(); });
  if (state.pestana === 'guia') {
    app.innerHTML = `${encabezado(state.perfil.nombre || state.user.email)}${consultorioHTML()}${pestanas}${urgenciaHTML()}${guiaHTML(state.perfil)}`;
    document.getElementById('salir').onclick = salir;
    enlazarPestanas();
    return;
  }
  app.innerHTML = `
    ${encabezado(state.perfil.nombre || state.user.email)}
    ${consultorioHTML()}
    ${pestanas}
    ${urgenciaHTML()}
    <h2 style="margin-top:20px">¿Qué quieres anotar?</h2>
    <div class="tipos" role="group" aria-label="Tipo de registro">
      ${Object.entries(TIPOS).map(([k, v]) => `<button data-tipo="${k}" aria-pressed="${k === state.tipo}">${k === 'laboratorio' && !tieneMeta(state.perfil) ? 'Laboratorio' : v.t}</button>`).join('')}
    </div>
    <form id="f-reg" class="panel" novalidate>
      ${state.tipo === 'laboratorio' ? metaPacienteHTML(state.perfil) : ''}
      ${camposActivos().map(campo).join('')}
      <label for="medido_en">Fecha y hora${state.tipo === 'palpitaciones' ? ' en que empezaron' : ''}</label>
      <input id="medido_en" type="datetime-local" value="${ahoraLocal()}">
      <label for="notas">Notas (opcional)</label>
      <p class="nota" style="margin:0 0 6px">No se revisan en tiempo real. Si es una urgencia, llame al ${URGENCIAS.numero}.</p>
      <textarea id="notas"></textarea>
      <div class="msg" id="msg" role="status"></div>
      <button class="primario" type="submit">Guardar registro</button>
    </form>
    <h2>Mis últimos registros</h2>
    ${state.regs.length ? `<ul class="lista">${state.regs.map(r => itemHTML(r)).join('')}</ul>` : '<p class="vacio">Todavía no has guardado ningún registro.</p>'}
    <p class="vacio" style="margin-top:24px">Si tiene dolor en el pecho, falta de aire intensa o desmayo, no use esta aplicación: llame a emergencias.</p>`;

  document.getElementById('salir').onclick = salir;
  document.querySelectorAll('[data-tipo]').forEach(b => b.onclick = () => { state.tipo = b.dataset.tipo; vistaPaciente(); });
  document.getElementById('f-reg').onsubmit = guardarRegistro;
  const selLab = document.getElementById('lab_nombre');
  if (selLab) selLab.onchange = () => {
    const l = LABS.find(x => x.n === selLab.value);
    const u = document.getElementById('lab_unidad');
    if (u && l) u.value = l.u;
  };
  enlazarPestanas();
}

async function guardarRegistro(e) {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const fila = { paciente_id: state.user.id, tipo: state.tipo };
  let hayDato = false;
  for (const [id, , tipoInput] of camposActivos()) {
    const v = document.getElementById(id).value.trim();
    if (v === '') continue;
    fila[id] = tipoInput === 'number' ? Number(v) : v;
    if (tipoInput === 'number') hayDato = true;
  }
  if (state.tipo === 'laboratorio') {
    if (fila.lab_nombre === 'Otro') {
      if (!fila.lab_otro) { msg.className = 'msg error'; msg.textContent = 'Escribe el nombre del estudio.'; return; }
      fila.lab_nombre = fila.lab_otro;
    }
    delete fila.lab_otro;
    if (fila.lab_valor != null && !fila.lab_nombre) { msg.className = 'msg error'; msg.textContent = 'Elige el estudio de laboratorio.'; return; }
    if (fila.lab_nombre && fila.lab_valor == null) { msg.className = 'msg error'; msg.textContent = 'Escribe el resultado del estudio.'; return; }
    if (fila.lab_nombre && !fila.lab_unidad) { const l = LABS.find(x => x.n === fila.lab_nombre); if (l) fila.lab_unidad = l.u; }
  }
  if (!hayDato) { msg.className = 'msg error'; msg.textContent = 'Escribe al menos un valor antes de guardar.'; return; }
  const cuando = document.getElementById('medido_en').value;
  fila.medido_en = cuando ? new Date(cuando).toISOString() : new Date().toISOString();
  const notas = document.getElementById('notas').value.trim();
  if (notas) fila.notas = notas;
  const { error } = await db.from('registros').insert(fila);
  if (error) { msg.className = 'msg error'; msg.textContent = 'No se pudo guardar: ' + error.message; return; }
  const posibleSintoma = state.tipo === 'palpitaciones' || (fila.notas && SINTOMAS_RE.test(sinAcentos(fila.notas)));
  await vistaPaciente();
  const nuevo = document.getElementById('msg');
  nuevo.className = 'msg ok'; nuevo.textContent = 'Registro guardado.';
  if (posibleSintoma) nuevo.innerHTML = 'Registro guardado. <strong>Esta aplicación no se revisa en tiempo real.</strong> Si tiene dolor de pecho, falta de aire, desmayo o malestar importante, llame al ' + URGENCIAS.numero + ' o acuda a urgencias.';
}

/* ================== ADMINISTRADOR ================== */
async function vistaAdmin() {
  await cargarAdmin();
  if (!state.canal) {
    state.canal = db.channel('registros-nuevos')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'registros' }, () => cargarAdmin())
      .subscribe();
  }
}

async function cargarAdmin() {
  const [p, r] = await Promise.all([
    db.from('profiles').select('*').eq('rol', 'paciente').order('nombre'),
    db.from('registros').select('*').order('medido_en', { ascending: false }).limit(2000)
  ]);
  state.pacientes = p.data || [];
  state.regs = r.data || [];
  pintarAdmin();
}

function pintarAdmin() {
  if (state.sel) return pintarPaciente();
  const hace7 = Date.now() - 7 * 864e5;
  const filas = state.pacientes.map(p => {
    const regs = state.regs.filter(x => x.paciente_id === p.id);
    const nAl = regs.filter(x => new Date(x.medido_en).getTime() >= hace7 && alertas(x, p).length).length;
    return { p, regs, nAl };
  }).sort((a, b) => b.nAl - a.nAl);
  app.innerHTML = `
    ${encabezado('Administrador')}
    <div class="invitar">
      <a class="btn-wa" href="${enlaceWhatsApp()}" target="_blank" rel="noopener">Invitar paciente por WhatsApp</a>
      <button id="copiar">Copiar enlace</button>
    </div>
    <h2 style="margin-top:0">Pacientes (${filas.length})</h2>
    ${filas.length ? `<ul class="lista">${filas.map(({ p, regs, nAl }) => `
      <li><button class="pac item${nAl ? ' alerta' : ''}" data-pac="${p.id}">
        <div class="n">${esc(p.nombre || 'Sin nombre')}</div>
        <div class="d">${regs.length ? 'Último registro: ' + esc(fecha(regs[0].medido_en)) : 'Sin registros'}</div>
        <div class="d">${metaTextoAdmin(p)}</div>
        ${p.riesgo_cv ? `<div class="d">Riesgo cardiovascular: ${esc(p.riesgo_cv)}</div>` : ''}
        ${nAl ? `<div class="aviso">${nAl} registro(s) con alerta en 7 días</div>` : ''}
      </button></li>`).join('')}</ul>` : '<p class="vacio">Aún no hay pacientes registrados. Comparte el enlace de la app para que creen su cuenta.</p>'}`;
  document.getElementById('salir').onclick = salir;
  document.getElementById('copiar').onclick = copiarEnlace;
  document.querySelectorAll('[data-pac]').forEach(b => b.onclick = () => { state.sel = b.dataset.pac; pintarAdmin(); });
}

function grafica(regs) {
  const p = regs.filter(r => r.tipo === 'presion').slice(0, 30).reverse();
  if (p.length < 2) return '<p class="vacio">Se necesitan al menos 2 mediciones de presión para graficar.</p>';
  const W = 320, H = 150, m = 26;
  const vals = p.flatMap(r => [r.sistolica, r.diastolica]).filter(v => v != null);
  const min = Math.min(...vals, 50) - 5, max = Math.max(...vals, 140) + 5;
  const x = i => m + i * (W - m * 1.5) / (p.length - 1);
  const y = v => H - m + 4 - (v - min) * (H - m * 1.6) / (max - min);
  const linea = k => p.map((r, i) => r[k] == null ? null : `${x(i).toFixed(1)},${y(r[k]).toFixed(1)}`).filter(Boolean).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tendencia de presión arterial">
      <text x="2" y="${y(max - 5).toFixed(0)}">${Math.round(max - 5)}</text>
      <text x="2" y="${y(min + 5).toFixed(0)}">${Math.round(min + 5)}</text>
      <line x1="${m}" x2="${W}" y1="${y(LIM.sistolica[1]).toFixed(1)}" y2="${y(LIM.sistolica[1]).toFixed(1)}" stroke="var(--alert)" stroke-dasharray="2 4" opacity=".6"/>
      <polyline points="${linea('sistolica')}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>
      <polyline points="${linea('diastolica')}" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-dasharray="5 3" stroke-linejoin="round"/>
    </svg>
    <div class="leyenda"><span>Línea continua: sistólica</span><span>Línea discontinua: diastólica</span></div>`;
}

function pintarPaciente() {
  const p = state.pacientes.find(x => x.id === state.sel);
  if (!p) { state.sel = null; return pintarAdmin(); }
  const regs = state.regs.filter(x => x.paciente_id === p.id);
  app.innerHTML = `
    ${encabezado('Administrador')}
    <button id="volver" class="enlace" style="padding-left:0">Volver a pacientes</button>
    <h2 style="margin-top:4px">${esc(p.nombre || 'Sin nombre')}</h2>
    <div class="panel" style="padding-top:16px">${grafica(regs)}</div>
    ${riesgoHTML(p)}
    ${anticoagulacionHTML(p)}
    ${laboratoriosHTML(regs, p)}
    <h2>Historial</h2>
    ${regs.length ? `<ul class="lista">${regs.slice(0, 100).map(r => itemHTML(r, p, true)).join('')}</ul>` : '<p class="vacio">Sin registros.</p>'}`;
  document.getElementById('salir').onclick = salir;
  document.getElementById('volver').onclick = () => { state.sel = null; pintarAdmin(); };
  enlazarAnticoagulacion(p);
  enlazarRiesgo(p);
}

/* ================== COMPARTIR E INSTALAR ================== */
const urlApp = () => location.origin + location.pathname.replace(/index\.html$/, '');

function enlaceWhatsApp() {
  const texto = 'Hola, le escribe el ' + MEDICO.nombre + ' (' + MEDICO.consultorio + '). Le comparto la aplicación para registrar sus mediciones (presión, pulso, peso, glucosa, palpitaciones y resultados de laboratorio). ' +
    'Ábrala aquí: ' + urlApp() + '\n\nToque «Primera vez: crear mi cuenta» y use su correo. ' +
    
    'Después puede instalarla en su celular para abrirla con un toque.' +
    '\n\nIMPORTANTE: ni esta aplicación ni este chat se revisan en tiempo real. Si tiene dolor de pecho, falta de aire, desmayo o alteración de la conciencia, palpitaciones intensas o malestar general importante, llame al ' + URGENCIAS.numero + ' o acuda a urgencias.' +
    '\n\nConsultas no urgentes: Tel. ' + MEDICO.telefono + ', ' + MEDICO.nota.toLowerCase() + '.';
  return 'https://wa.me/?text=' + encodeURIComponent(texto);
}

async function copiarEnlace() {
  const b = document.getElementById('copiar');
  try { await navigator.clipboard.writeText(urlApp()); b.textContent = 'Enlace copiado'; }
  catch (e) { b.textContent = urlApp(); }
  setTimeout(() => { if (b) b.textContent = 'Copiar enlace'; }, 2500);
}

let eventoInstalar = null;
const esStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const esIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);

function pintarInstalar() {
  const c = document.getElementById('instalar');
  let oculto = false;
  try { oculto = localStorage.getItem('ocultar_instalar') === '1'; } catch (e) {}
  if (esStandalone() || oculto || (!eventoInstalar && !esIOS())) { c.hidden = true; return; }
  c.hidden = false;
  c.innerHTML = `<div class="panel">
    <strong>Tenga esta app en su celular</strong>
    ${eventoInstalar
      ? '<p>Instálela para abrirla con un toque, como cualquier otra app.</p><button class="primario" id="btn-instalar">Instalar app</button>'
      : '<p>En iPhone: toque el botón Compartir y elija «Agregar a pantalla de inicio».</p>'}
    <button class="enlace" id="btn-ahora-no">Ahora no</button>
  </div>`;
  const bi = document.getElementById('btn-instalar');
  if (bi) bi.onclick = async () => { eventoInstalar.prompt(); await eventoInstalar.userChoice; eventoInstalar = null; pintarInstalar(); };
  document.getElementById('btn-ahora-no').onclick = () => {
    try { localStorage.setItem('ocultar_instalar', '1'); } catch (e) {}
    c.hidden = true;
  };
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); eventoInstalar = e; pintarInstalar(); });
window.addEventListener('appinstalled', () => { eventoInstalar = null; pintarInstalar(); });
pintarInstalar();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ================== ARRANQUE ================== */
async function iniciar(session) {
  if (!session) { state.user = null; state.perfil = null; state.sel = null; return vistaAcceso(); }
  state.user = session.user;
  const { data } = await db.from('profiles').select('*').eq('id', session.user.id).single();
  state.perfil = data || { nombre: '', rol: 'paciente' };
  return state.perfil.rol === 'admin' ? vistaAdmin() : vistaPaciente();
}

db.auth.onAuthStateChange((evento, session) => {
  if (evento === 'TOKEN_REFRESHED') return;
  setTimeout(() => iniciar(session), 0);
});
</script>
